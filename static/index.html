const Theme = {
  mq: window.matchMedia ? matchMedia('(prefers-color-scheme: dark)') : null,
  pref: 'system',
  init(pref) {
    this.pref = pref;
    const onChange = () => { if (this.pref === 'system') this.apply(); };
    if (this.mq) { if (this.mq.addEventListener) this.mq.addEventListener('change', onChange); else if (this.mq.addListener) this.mq.addListener(onChange); }
    this.apply();
  },
  resolved() { return this.pref === 'system' ? (this.mq && this.mq.matches ? 'dark' : 'light') : this.pref; },
  set(pref) { this.pref = pref; Settings.set('theme', pref); this.apply(); },
  toggle() { this.set(this.resolved() === 'dark' ? 'light' : 'dark'); },
  apply() {
    const r = this.resolved();
    document.documentElement.setAttribute('data-theme', r);
    const meta = $('meta[name="theme-color"]'); if (meta) meta.content = r === 'dark' ? '#1E1B2E' : '#FFF8F0';
    $$('.theme-toggle').forEach(b => { b.textContent = r === 'dark' ? '🌙' : '☀️'; });
    $$('#set-theme button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.v === this.pref)));
  },
  color(name) { return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); },
};

/* =========================================================================
   6. Judge / ScoreKeeper — 판정·점수 ①~⑥·퍼펙트 콤보·라운드 등급·최대 점수
   이벤트 소싱: 기록된 이벤트를 재생해 상태를 만들므로 라운드 롤백이 간단하다.
   ========================================================================= */
class ScoreKeeper {
  constructor(level, bpm) {
    const S = CONFIG.SCORING;
    this.levelMul = S.levelMul[level];
    this.bpmMul = Math.round(clamp(bpm / S.bpmMul.base, S.bpmMul.min, S.bpmMul.max) * 10000) / 10000;
    this.mul = Math.round(this.levelMul * this.bpmMul * 10000) / 10000;
    this.events = [];
    this.reset();
  }
  reset() {
    this.hit = 0; this.round = 0; this.combo = 0; this.special = 0; this.penalty = 0;
    this.perfectCombo = 0; this.maxPerfectCombo = 0;
    this.counts = { perfect: 0, great: 0, good: 0, miss: 0 };
    this.wrongHits = 0;
    this.roundWrong = new Array(CONFIG.TOTAL_ROUNDS).fill(0);
    this.roundGrades = new Array(CONFIG.TOTAL_ROUNDS).fill(null);
    this.roundBonuses = new Array(CONFIG.TOTAL_ROUNDS).fill(0);
    this.roundAcc = Array.from({ length: CONFIG.TOTAL_ROUNDS }, () => ({ pts: 0, n: 0 }));
    this.milestones = {};
    this.specials = [];
    this.deltas = [];
    this.fullPerfect = false; this.noMiss = false;
  }
  static comboBonus(n) {
    for (const tier of CONFIG.SCORING.perfectCombo) {
      if (n >= tier.min && n <= tier.max) return tier.step ? tier.step * (n - 1) : tier.perHit;
    }
    return 0;
  }
  record(ev) { this.events.push(ev); return this.apply(ev); }
  apply(ev) {
    const S = CONFIG.SCORING;
    const fx = { points: 0, comboBonus: 0, milestone: 0, callout: 0 };
    if (ev.type === 'hit') {
      const r = ev.result;
      this.counts[r]++;
      this.hit += S.hit[r]; fx.points = S.hit[r];
      const ra = this.roundAcc[ev.round]; ra.n++; ra.pts += { perfect: 100, great: 70, good: 40, miss: 0 }[r];
      if (r !== 'miss' && ev.deltaMs != null) this.deltas.push(ev.deltaMs);
      if (r === 'perfect') {
        this.perfectCombo++;
        this.maxPerfectCombo = Math.max(this.maxPerfectCombo, this.perfectCombo);
        const b = ScoreKeeper.comboBonus(this.perfectCombo);
        this.combo += b; fx.comboBonus = b;
        const m = S.milestone[this.perfectCombo];
        if (m && !this.milestones[this.perfectCombo]) {
          this.milestones[this.perfectCombo] = true;
          this.special += m; fx.milestone = m;
          this.specials.push({ label: this.perfectCombo + ' PERFECT COMBO', value: m });
        }
        if (CONFIG.COMBO_CALLOUTS.includes(this.perfectCombo)) fx.callout = this.perfectCombo;
      } else {
        this.perfectCombo = 0;
        this.roundWrong[ev.round]++;
      }
    } else if (ev.type === 'wrong') {
      this.wrongHits++;
      this.penalty += -S.wrongHit; fx.points = S.wrongHit;
      this.perfectCombo = 0;
      if (ev.round >= 0 && ev.round < CONFIG.TOTAL_ROUNDS) this.roundWrong[ev.round]++;
    } else if (ev.type === 'roundEnd') {
      const w = this.roundWrong[ev.round];
      const base = S.roundBonus[w] != null ? S.roundBonus[w] : S.roundBonus.else;
      const bonus = Math.round(base * S.roundWeight[ev.round]);
      this.round += bonus; this.roundBonuses[ev.round] = bonus;
      const grade = w === 0 ? 'PERFECT' : w === 1 ? 'GREAT' : w === 2 ? 'GOOD' : 'BREAK';
      this.roundGrades[ev.round] = grade;
      fx.grade = grade; fx.bonus = bonus;
    } else if (ev.type === 'final') {
      if (ev.totalNotes > 0 && this.counts.perfect === ev.totalNotes && this.wrongHits === 0) {
        this.fullPerfect = true; this.special += S.fullPerfect;
        this.specials.push({ label: 'FULL PERFECT', value: S.fullPerfect });
      } else if (this.counts.miss === 0 && this.wrongHits === 0) {
        this.noMiss = true; this.special += S.noMiss;
        this.specials.push({ label: 'NO MISS', value: S.noMiss, i18n: 'noMiss' });
      }
    }
    return fx;
  }
  rollbackTo(round) {
    const keep = this.events.filter(e => e.type !== 'final' && e.round < round);
    this.events = [];
    this.reset();
    keep.forEach(e => this.record(e));
  }
  get raw() { return this.hit + this.round + this.combo + this.special - this.penalty; }
  total() { return Math.floor(Math.max(0, this.raw) * this.mul + 1e-6); }
  accuracy(totalNotes) {
    if (!totalNotes) return 0;
    const c = this.counts;
    return (c.perfect * 100 + c.great * 70 + c.good * 40) / (totalNotes * 100) * 100;
  }
  avgDelta() { return this.deltas.length ? this.deltas.reduce((a, b) => a + b, 0) / this.deltas.length : null; }
  /** 같은 패턴을 "전부 PERFECT + 헛치기 0" 으로 시뮬레이션한 이론상 최대 점수 */
  static simulateMax(rounds, level, bpm) {
    const k = new ScoreKeeper(level, bpm);
    let total = 0;
    rounds.forEach(r => {
      r.notes.forEach(() => k.record({ type: 'hit', round: r.index, result: 'perfect', deltaMs: 0 }));
      total += r.notes.length;
      k.record({ type: 'roundEnd', round: r.index });
    });
    k.record({ type: 'final', totalNotes: total });
    return k.total();
  }
}

/* =========================================================================
   App-level Game (타임라인·스케줄러·판정 연결)
   ========================================================================= */
class Game {
  constructor({ seed, bpm, level }) {
    this.seed = seed; this.bpm = bpm; this.level = level;
    this.beatDur = 60 / bpm;
    this.span = CONFIG.BEATS_PER_ROUND * (1 + CONFIG.GAP_BARS_BETWEEN_ROUNDS);
    this.rounds = PatternGenerator.generate(seed, level);
    this.notes = [];
    let id = 0;
    this.rounds.forEach(r => r.notes.forEach(n => {
      this.notes.push({ id: id++, round: r.index, beatPos: n.beatPos, padId: n.padId, eighth: n.eighth, chord: n.chord,
        time: 0, judged: false, result: null, deltaMs: null });
    }));
    this.roundNotes = this.rounds.map(r => this.notes.filter(n => n.round === r.index));
    this.padNotes = {};
    CONFIG.PAD_IDS.forEach(p => { this.padNotes[p] = this.notes.filter(n => n.padId === p); });
    this.score = new ScoreKeeper(level, bpm);
    this.maxPossible = ScoreKeeper.simulateMax(this.rounds, level, bpm);
    this.state = 'idle';
    this.version = 0;          // 판정이 바뀔 때마다 증가 → 도트 다시 그리기
    this.finished = false;
    this.schedTimer = null;
  }
  get offset() { return Settings.data.offsetMs / 1000; }
  roundStart(r) { return this.origin + (CONFIG.COUNT_IN_BEATS + (r - this.firstRound) * this.span) * this.beatDur; }
  roundEnd(r) { return this.roundStart(r) + CONFIG.BEATS_PER_ROUND * this.beatDur; }
  totalBeats() { return CONFIG.COUNT_IN_BEATS + (CONFIG.TOTAL_ROUNDS - this.firstRound) * this.span - CONFIG.GAP_BARS_BETWEEN_ROUNDS * CONFIG.BEATS_PER_ROUND; }

  begin(fromRound) {
    this.firstRound = fromRound;
    this.nextFinalize = fromRound;
    this.origin = AudioEngine.now() + CONFIG.START_DELAY_S;
    this.notes.forEach(n => {
      if (n.round >= fromRound) {
        n.time = this.roundStart(n.round) + n.beatPos * this.beatDur;
        n.judged = false; n.result = null; n.deltaMs = null;
      }
    });
    this.nextBeat = 0;
    this.state = 'countIn';
    this.finished = false;
    this.version++;
    this.startScheduler();
  }

  /** 시각 t(초)에서의 위치 */
  position(t) {
    const CI = CONFIG.COUNT_IN_BEATS;
    const b = (t - this.origin) / this.beatDur;
    if (b < CI) return { phase: 'countIn', round: this.firstRound, beat: Math.max(0, b), abs: b };
    const rb = b - CI;
    const ri = Math.floor(rb / this.span);
    const inR = rb - ri * this.span;
    const round = this.firstRound + ri;
    if (round >= CONFIG.TOTAL_ROUNDS) return { phase: 'end', round: CONFIG.TOTAL_ROUNDS - 1, beat: 3.999, abs: b };
    if (inR >= CONFIG.BEATS_PER_ROUND) return { phase: 'gap', round, beat: (inR - CONFIG.BEATS_PER_ROUND) % 4, abs: b };
    return { phase: 'round', round, beat: inR, abs: b };
  }

  /* ---------- 메트로놈 lookahead 스케줄러 ---------- */
  startScheduler() {
    this.stopScheduler();
    if (!AudioEngine.useCtx) return;
    this.schedTimer = setInterval(() => this.schedule(), CONFIG.SCHED_INTERVAL_MS);
    this.schedule();
  }
  stopScheduler() { if (this.schedTimer) { clearInterval(this.schedTimer); this.schedTimer = null; } }
  schedule() {
    const ctx = AudioEngine.ctx;
    if (!ctx || !AudioEngine.useCtx) return;
    const horizon = ctx.currentTime + CONFIG.SCHED_LOOKAHEAD_S;
    const total = this.totalBeats();
    const CI = CONFIG.COUNT_IN_BEATS;
    while (this.nextBeat < total) {
      const bt = this.origin + this.nextBeat * this.beatDur;
      if (bt > horizon) break;
      if (bt >= ctx.currentTime - 0.02) {
        const isCI = this.nextBeat < CI;
        const rb = this.nextBeat - CI;
        const inBar = isCI ? this.nextBeat : (rb % this.span) % 4;
        if (isCI || Settings.data.metronome) AudioEngine.tick(bt, inBar === 0, isCI);
        if (!isCI && rb % this.span === 0) {
          const r = this.firstRound + rb / this.span;
          if (this.rounds[r] && this.rounds[r].newPads.length) AudioEngine.pop(bt);
        }
      }
      this.nextBeat++;
    }
  }

  /* ---------- 판정 ---------- */
  onPad(padId, perfMs) {
    if (this.state !== 'countIn' && this.state !== 'playing') return null;
    const tIn = AudioEngine.audible(perfMs) - this.offset;
    let best = null, bestD = 0;
    for (const n of this.padNotes[padId]) {
      if (n.judged || n.round < this.firstRound) continue;
      const d = tIn - n.time;
      if (Math.abs(d) <= W.good && (!best || Math.abs(d) < Math.abs(bestD))) { best = n; bestD = d; }
    }
    if (best) {
      const ad = Math.abs(bestD);
      const result = ad <= W.perfect ? 'perfect' : ad <= W.great ? 'great' : 'good';
      this.judge(best, result, Math.round(bestD * 1000));
      return result;
    }
    // 헛치기: 판정 윈도우 안에 이 패드의 노트가 없음 (비활성 패드·카운트인 제외)
    const pos = this.position(tIn);
    if (pos.phase !== 'round') return null;
    let r = pos.round;
    if (r < this.nextFinalize) r = this.nextFinalize;   // 이미 정산된 라운드면 다음 라운드로
    if (r >= CONFIG.TOTAL_ROUNDS || !this.rounds[r].pads.includes(padId)) return null;
    this.score.record({ type: 'wrong', round: r });
    Renderer.onWrong(padId, CONFIG.SCORING.wrongHit);
    return 'wrong';
  }
  judge(n, result, deltaMs) {
    n.judged = true; n.result = result; n.deltaMs = deltaMs;
    this.version++;
    const fx = this.score.record({ type: 'hit', round: n.round, result, deltaMs });
    Renderer.onJudge(n, result, fx);
  }

  /** 매 프레임: 자동 MISS, 라운드 정산, 종료 판단 */
  update(now) {
    if (this.state !== 'countIn' && this.state !== 'playing') return;
    const tv = now - this.offset;
    const pos = this.position(tv);
    if (this.state === 'countIn' && pos.phase !== 'countIn') this.state = 'playing';
    for (const n of this.notes) {
      if (!n.judged && n.round >= this.firstRound && tv - n.time > W.good) this.judge(n, 'miss', null);
    }
    while (this.nextFinalize < CONFIG.TOTAL_ROUNDS) {
      const r = this.nextFinalize;
      if (tv >= this.roundEnd(r) && this.roundNotes[r].every(n => n.judged)) {
        const fx = this.score.record({ type: 'roundEnd', round: r });
        this.nextFinalize++;
        Renderer.onRoundEnd(r, fx);
      } else break;
    }
    if (this.nextFinalize >= CONFIG.TOTAL_ROUNDS && !this.finished) this.finish();
  }
  finish() {
    this.finished = true;
    this.state = 'ending';
    this.stopScheduler();
    this.score.record({ type: 'final', totalNotes: this.notes.length });
    Renderer.onFinish(this.score);
    const delay = this.score.fullPerfect || this.score.noMiss ? 1700 : 900;
    this.endAt = performance.now() + delay;
  }

  pause() {
    if (this.state !== 'countIn' && this.state !== 'playing') return false;
    this.update(AudioEngine.audible());
    if (this.finished) return false;
    this.state = 'paused';
    this.stopScheduler();
    this.pausedRound = Math.min(this.nextFinalize, CONFIG.TOTAL_ROUNDS - 1);
    return true;
  }
  /** 재개: 카운트인 1마디 후 현재 라운드 처음부터 (해당 라운드 점수 롤백) */
  resume() {
    const r = this.pausedRound;
    this.score.rollbackTo(r);
    this.begin(r);
  }
  stop() { this.stopScheduler(); this.state = 'stopped'; }

  buildResult() {
    const s = this.score;
    const total = s.total();
    return {
      total, maxPossible: this.maxPossible,
      breakdown: { hit: s.hit, round: s.round, combo: s.combo, special: s.special, penalty: s.penalty,
        multiplier: s.mul, levelMul: s.levelMul, bpmMul: s.bpmMul },
      specials: s.specials.slice(),
      roundGrades: s.roundGrades.map(g => g || 'BREAK'),
      accuracy: s.accuracy(this.notes.length),
      maxPerfectCombo: s.maxPerfectCombo,
      counts: Object.assign({}, s.counts), wrongHits: s.wrongHits,
      avgDeltaMs: s.avgDelta(),
      roundAccuracy: s.roundAcc.map(a => (a.n ? a.pts / a.n : 0)),
      totalNotes: this.notes.length,
      fullPerfect: s.fullPerfect, noMiss: s.noMiss,
      bpm: this.bpm, level: this.level, seed: this.seed, playedAt: Date.now(),
    };
  }
}

/* =========================================================================
   7. Renderer — rAF 루프, 허브(박자 링), 패드 애니메이션
   ========================================================================= */
const Renderer = {
  pads: {},
  build() {
    const wrap = $('#pads');
    wrap.innerHTML = '';
    CONFIG.PAD_IDS.forEach(id => {
      const el = document.createElement('div');
      el.className = 'pad';
      el.dataset.pad = id;
      el.setAttribute('role', 'button');
      el.innerHTML =
        '<div class="pad-body"><div class="pad-glow"></div><div class="pad-ring"></div>' +
        '<div class="pad-face"><span class="pad-key">' + id + '</span><span class="pad-new en">NEW!</span>' +
        '<span class="pad-icon" aria-hidden="true">♩</span>' +
        '<div class="pad-beats"><div class="pad-dots cur"></div><div class="pad-next"><span class="next-label">NEXT</span><div class="pad-dots nx"></div></div></div>' +
        '<div class="pad-flash"></div></div></div>';
      wrap.appendChild(el);
      this.pads[id] = {
        el, body: $('.pad-body', el), glow: $('.pad-glow', el), ring: $('.pad-ring', el), face: $('.pad-face', el),
        icon: $('.pad-icon', el), dots: $('.pad-dots.cur', el), nextDots: $('.pad-dots.nx', el), flash: $('.pad-flash', el),
        cache: {}, pressTimer: 0, pressedAt: 0,
      };
    });
    // 허브 SVG: 4박 세그먼트 + 라운드 진행 링 + 재생헤드
    const svg = $('#hub-svg');
    const R = 44, arc = (a0, a1, r) => {
      const p = a => [50 + r * Math.cos(a * Math.PI / 180), 50 + r * Math.sin(a * Math.PI / 180)];
      const [x0, y0] = p(a0), [x1, y1] = p(a1);
      return `M${x0.toFixed(2)} ${y0.toFixed(2)} A${r} ${r} 0 ${a1 - a0 > 180 ? 1 : 0} 1 ${x1.toFixed(2)} ${y1.toFixed(2)}`;
    };
    let html = '<circle class="prog-bg" cx="50" cy="50" r="36"/><circle class="prog" id="hub-prog" cx="50" cy="50" r="36" transform="rotate(-90 50 50)" stroke-dasharray="0 1000"/>';
    for (let i = 0; i < 4; i++) html += `<path class="seg${i === 0 ? ' strong' : ''}" d="${arc(-90 + i * 90 + 7, -90 + (i + 1) * 90 - 7, R)}"/>`;
    html += `<g id="hub-head"><circle class="head" cx="50" cy="${50 - R}" r="4.2"/></g>`;
    svg.innerHTML = html;
    this.hubSegs = $$('.seg', svg);
    this.hubHead = $('#hub-head');
    this.hubProg = $('#hub-prog');
    this.progLen = 2 * Math.PI * 36;
    this.hubScore = $('#hub-score'); this.hubRound = $('#hub-round'); this.hubCount = $('#hub-count');
    this.float = $('#float-layer'); this.comboChip = $('#combo-chip');
  },
  reset(game) {
    this.game = game;
    this.renderKey = '';
    this.lastBeatIdx = -1; this.lastCount = null; this.lastRoundShown = null;
    this.displayScore = game.score.total(); this.scoreFrom = this.displayScore; this.scoreTo = this.displayScore; this.scoreStart = 0;
    this.hubScore.textContent = I18n.fmt(this.displayScore);
    this.comboChip.hidden = true; this.lastCombo = 0; this.popSlots = [];
    $$('.banner, .score-pop, .sparkles', this.float).forEach(e => e.remove());
    Object.values(this.pads).forEach(p => { p.cache = {}; p.el.classList.remove('is-new', 'pressed', 'show-next'); });
  },
  setPressed(id, on) {
    const p = this.pads[id]; if (!p) return;
    clearTimeout(p.pressTimer);
    if (on) { p.pressedAt = performance.now(); p.el.classList.add('pressed'); }
    else {
      const left = 60 - (performance.now() - p.pressedAt);   // 눌림 연출 최소 60ms
      if (left > 0) p.pressTimer = setTimeout(() => p.el.classList.remove('pressed'), left);
      else p.el.classList.remove('pressed');
    }
  },
  retrigger(el, cls) { el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); },
  judgePop(padId, text, cls) {
    const p = this.pads[padId];
    const d = document.createElement('div');
    d.className = 'judge-pop ' + cls; d.textContent = text;
    d.addEventListener('animationend', () => d.remove());
    p.body.appendChild(d);
  },
  onJudge(n, result, fx) {
    const p = this.pads[n.padId];
    this.judgePop(n.padId, result.toUpperCase(), result);
    p.flash.style.setProperty('--flash', Theme.color('--' + result));
    this.retrigger(p.flash, 'go');
    if (result === 'miss' && !reducedMotion()) this.retrigger(p.face, 'shake');
    const bonus = (fx.comboBonus || 0) + (fx.milestone || 0);
    if (bonus > 0) this.scorePop('+' + I18n.fmt(bonus * this.game.score.mul));
    if (fx.callout) { this.banner(fx.callout + ' PERFECT COMBO!', 'callout perfect', 900); AudioEngine.milestone(); }
    this.updateScoreTarget();
  },
  onWrong(padId, pts) {
    this.judgePop(padId, I18n.fmt(pts * this.game.score.mul), 'wrong');
    this.updateScoreTarget();
  },
  onRoundEnd(r, fx) {
    const map = { PERFECT: ['PERFECT ROUND!', 'perfect'], GREAT: ['GREAT ROUND', 'great'], GOOD: ['GOOD ROUND', 'good'], BREAK: ['BREAK', 'break'] };
    const [txt, cls] = map[fx.grade];
    this.banner(txt, 'round ' + cls, 600);
    if (fx.grade === 'PERFECT') { AudioEngine.arpeggio(); this.sparkles(14); }
    else if (fx.grade === 'BREAK') AudioEngine.buu();
    if (fx.bonus > 0) this.scorePop('+' + I18n.fmt(fx.bonus * this.game.score.mul));
    this.updateScoreTarget();
  },
  onFinish(score) {
    if (score.fullPerfect) { this.banner('FULL PERFECT!', 'big perfect', 1600); this.sparkles(36); AudioEngine.fanfare(); }
    else if (score.noMiss) { this.banner(t('noMiss'), 'big great', 1500); this.sparkles(18); AudioEngine.arpeggio(); }
    this.updateScoreTarget();
  },
  banner(text, cls, ms) {
    const b = document.createElement('div');
    b.className = 'banner ' + cls; b.textContent = text;
    b.style.animationDuration = ms + 'ms';
    b.addEventListener('animationend', () => b.remove());
    this.float.appendChild(b);
  },
  scorePop(text) {
    const d = document.createElement('div');
    d.className = 'score-pop' + (text.startsWith('-') || text.startsWith('−') ? ' minus' : '');
    d.textContent = text;
    // 동시에 뜨는 팝업은 아래로 쌓아서 겹치지 않게
    const slot = this.popSlots.indexOf(false) >= 0 ? this.popSlots.indexOf(false) : this.popSlots.length;
    this.popSlots[slot] = true;
    d.style.marginTop = slot * 24 + 'px';
    d.addEventListener('animationend', () => { this.popSlots[slot] = false; d.remove(); });
    this.float.appendChild(d);
  },
  sparkles(n) {
    if (reducedMotion()) return;
    const box = document.createElement('div'); box.className = 'sparkles';
    const colors = ['--pad-7', '--pad-9', '--pad-1', '--pad-3', '--perfect'].map(c => Theme.color(c));
    for (let i = 0; i < n; i++) {
      const s = document.createElement('i');
      const a = Math.random() * Math.PI * 2, d = 80 + Math.random() * 180;
      s.style.setProperty('--x', Math.cos(a) * d + 'px'); s.style.setProperty('--y', Math.sin(a) * d + 'px');
      s.style.background = colors[i % colors.length];
      s.style.animationDelay = Math.random() * 0.12 + 's';
      box.appendChild(s);
    }
    this.float.appendChild(box);
    setTimeout(() => box.remove(), 1400);
  },
  updateScoreTarget() {
    const target = this.game.score.total();
    if (target === this.scoreTo) return;
    this.scoreFrom = this.displayScore; this.scoreTo = target; this.scoreStart = performance.now();
    if (target > this.scoreFrom) this.retrigger(this.hubScore, 'bump');
  },

  dotsHTML(round, padId) {
    const g = this.game;
    const notes = g.roundNotes[round.index].filter(n => n.padId === padId);
    const step = 4 / round.subdiv;
    let h = '';
    for (let s = 0; s < round.subdiv; s++) {
      const bp = s * step;
      const n = notes.find(x => Math.abs(x.beatPos - bp) < 1e-6);
      let cls = 'dot' + (round.subdiv === 8 && s % 2 ? ' half' : '');
      if (n) cls += n.judged ? ' j-' + n.result : ' on';
      h += `<i class="${cls}" data-s="${s}"></i>`;
    }
    return h;
  },

  frame(now) {
    const g = this.game;
    if (!g) return;
    const tv = now - g.offset;
    const pos = g.position(tv);
    const inPlay = pos.phase === 'round' || pos.phase === 'gap';
    const dispRound = pos.phase === 'countIn' ? null : pos.round;
    const activeRound = g.rounds[dispRound == null ? g.firstRound : dispRound];
    let nextIdx = null;
    if (pos.phase === 'countIn') nextIdx = g.firstRound;
    else if ((pos.phase === 'round' && pos.beat >= 3) || pos.phase === 'gap') nextIdx = pos.round + 1 < CONFIG.TOTAL_ROUNDS ? pos.round + 1 : null;
    const beatIdx = Math.floor(pos.beat);

    // --- 라운드 전환: NEW! 뱃지
    if (dispRound != null && dispRound !== this.lastRoundShown) {
      this.lastRoundShown = dispRound;
      const r = g.rounds[dispRound];
      r.newPads.forEach(id => {
        const p = this.pads[id];
        p.el.classList.remove('is-new'); void p.el.offsetWidth; p.el.classList.add('is-new');
        setTimeout(() => p.el.classList.remove('is-new'), 1600);
      });
    }

    // --- 도트/아이콘 (판정·라운드·미리보기 변화 시에만 다시 그림)
    const key = `${dispRound}|${nextIdx}|${g.version}|${inPlay ? beatIdx : -1}`;
    if (key !== this.renderKey) {
      this.renderKey = key;
      CONFIG.PAD_IDS.forEach(id => {
        const p = this.pads[id];
        const active = activeRound.pads.includes(id);
        p.el.classList.toggle('inactive', !active && !(nextIdx != null && g.rounds[nextIdx].pads.includes(id) && pos.phase === 'countIn'));
        if (dispRound != null && active) {
          p.dots.innerHTML = this.dotsHTML(activeRound, id);
          if (pos.phase === 'round') {
            const sub = activeRound.subdiv, per = sub / 4;
            $$('.dot', p.dots).forEach((d, s) => { if (Math.floor(s / per) === beatIdx) d.classList.add('now'); });
          }
        } else p.dots.innerHTML = '';
        const showNext = nextIdx != null && g.rounds[nextIdx].pads.includes(id);
        p.el.classList.toggle('show-next', showNext);
        if (showNext) p.nextDots.innerHTML = this.dotsHTML(g.rounds[nextIdx], id);
        // 아이콘: 다가오는 노트가 8분음표면 ♪, 아니면 ♩
        const upcoming = g.padNotes[id].find(n => !n.judged && n.round >= g.firstRound);
        const inRoundLeft = g.roundNotes[activeRound.index].some(n => n.padId === id && !n.judged);
        p.icon.textContent = upcoming && upcoming.eighth ? '♪' : '♩';
        p.icon.classList.toggle('done', dispRound != null && active && !inRoundLeft && !showNext);
      });
    }

    // --- 접근 링 & 두근 (오디오 시계 기준, 매 프레임 계산)
    const rm = reducedMotion();
    const amp = rm ? 0.05 : 0.10;
    CONFIG.PAD_IDS.forEach(id => {
      const p = this.pads[id];
      let upcoming = null, last = null;
      for (const n of g.padNotes[id]) {
        if (n.round < g.firstRound) continue;
        if (n.time > tv) { if (!upcoming || n.time < upcoming.time) upcoming = n; }
        else if (!last || n.time > last.time) last = n;
      }
      // 두근
      let s = 1, glow = 0, iconS = 1;
      if (last) {
        const e = tv - last.time;
        if (e < CONFIG.PULSE_S) {
          const k = e / CONFIG.PULSE_S;
          const curve = Math.sin(Math.PI * Math.min(1, k * 1.25)) * (1 - k * 0.3);
          s = 1 + amp * Math.max(0, curve);
          glow = Math.max(0, 1 - k);
          iconS = 1 + amp * 1.6 * Math.max(0, curve);
        }
      }
      // 접근 링: T − 1박 ~ T 동안 바깥에서 테두리로 줄어듦
      let ringS = 1, ringO = 0;
      if (upcoming && !upcoming.judged) {
        const pr = (upcoming.time - tv) / g.beatDur;
        if (pr <= 1) { ringS = 1 + 0.22 * pr; ringO = 0.25 + 0.75 * (1 - pr); glow = Math.max(glow, (1 - pr) * 0.25); }
      }
      const c = p.cache;
      const bs = s.toFixed(4);
      if (c.bs !== bs) { c.bs = bs; p.body.style.transform = s === 1 ? '' : `scale(${bs})`; }
      const is = iconS.toFixed(3);
      if (c.is !== is) { c.is = is; p.icon.style.transform = iconS === 1 ? '' : `scale(${is}) translateY(${((1 - iconS) * 40).toFixed(1)}%)`; }
      const go = glow.toFixed(2);
      if (c.go !== go) { c.go = go; p.glow.style.opacity = go; }
      const rs = ringS.toFixed(4) + '|' + ringO.toFixed(2);
      if (c.rs !== rs) { c.rs = rs; p.ring.style.transform = `scale(${ringS.toFixed(4)})`; p.ring.style.opacity = ringO.toFixed(2); }
    });

    // --- 허브: 박자 세그먼트, 재생헤드(연속 이동), 라운드 진행
    const barFrac = clamp(pos.beat / 4, 0, 0.9999);
    this.hubHead.setAttribute('transform', `rotate(${(barFrac * 360).toFixed(2)} 50 50)`);
    if (beatIdx !== this.lastBeatIdx) {
      this.lastBeatIdx = beatIdx;
      this.hubSegs.forEach((sg, i) => sg.classList.toggle('on', i === beatIdx && pos.phase !== 'end'));
    }
    const doneRounds = pos.phase === 'countIn' ? g.firstRound : pos.round + (pos.phase === 'end' ? 1 : barFrac);
    this.hubProg.setAttribute('stroke-dasharray', `${(this.progLen * doneRounds / CONFIG.TOTAL_ROUNDS).toFixed(2)} 1000`);
    if (pos.phase === 'countIn') {
      const cnt = String(4 - Math.min(3, beatIdx));
      if (this.lastCount !== cnt) {
        this.lastCount = cnt;
        this.hubCount.hidden = false; this.hubScore.hidden = true;
        this.hubCount.textContent = cnt;
        this.hubRound.textContent = t('countIn');
        this.retrigger(this.hubCount, 'tick');
      }
    } else if (this.lastCount !== null) {
      this.lastCount = null;
      this.hubCount.hidden = true; this.hubScore.hidden = false;
    }
    if (pos.phase !== 'countIn') {
      const rt = `R${Math.min(pos.round, 7) + 1}/${CONFIG.TOTAL_ROUNDS}`;
      if (this.hubRound.textContent !== rt) this.hubRound.textContent = rt;
    }

    // --- 점수 촤르륵 (250ms, easeOutCubic)
    if (this.displayScore !== this.scoreTo) {
      const k = clamp((performance.now() - this.scoreStart) / 250, 0, 1);
      const e = 1 - Math.pow(1 - k, 3);
      this.displayScore = k >= 1 ? this.scoreTo : Math.round(this.scoreFrom + (this.scoreTo - this.scoreFrom) * e);
      this.hubScore.textContent = I18n.fmt(this.displayScore);
    }
    // --- 퍼펙트 콤보 칩 (2 이상일 때만)
    const pc = g.score.perfectCombo;
    if (pc !== this.lastCombo) {
      this.lastCombo = pc;
      this.comboChip.hidden = pc < 2;
      if (pc >= 2) { this.comboChip.textContent = `PERFECT COMBO ×${pc}`; this.retrigger(this.comboChip, 'bump'); }
    }
  },
};

/* =========================================================================
   5. InputManager — 포인터(멀티터치) / 키보드 → padId
   ========================================================================= */
const KEY_TO_PAD = {
  Numpad7: 7, Numpad9: 9, Numpad1: 1, Numpad3: 3,   // NumLock 상태와 무관하게 code 로 판별
  KeyQ: 7, KeyW: 9, KeyA: 1, KeyS: 3,
  KeyU: 7, KeyI: 9, KeyJ: 1, KeyK: 3,
};
const InputManager = {
  pointerPad: new Map(),
  lastHit: {},
  handler: null,
  normTs(ts) {
    const now = performance.now();
    return (typeof ts === 'number' && ts > 0 && ts <= now + 5 && now - ts < 500) ? ts : now;
  },
  init(handler) {
    this.handler = handler;
    const wrap = $('#pads');
    wrap.addEventListener('pointerdown', e => {
      const el = e.target.closest('.pad'); if (!el) return;
      e.preventDefault();
      const id = +el.dataset.pad;
      try { el.setPointerCapture(e.pointerId); } catch (_) { /* noop */ }
      this.pointerPad.set(e.pointerId, id);
      this.press(id, e.timeStamp, e.pointerType !== 'mouse');
    });
    const up = e => {
      const id = this.pointerPad.get(e.pointerId); if (id == null) return;
      this.pointerPad.delete(e.pointerId);
      Renderer.setPressed(id, false);
    };
    ['pointerup', 'pointercancel', 'lostpointercapture'].forEach(ev => wrap.addEventListener(ev, up));
    wrap.addEventListener('contextmenu', e => e.preventDefault());
  },
  press(id, ts, touch) {
    const perf = this.normTs(ts);
    Renderer.setPressed(id, true);
    if (this.lastHit[id] != null && perf - this.lastHit[id] < CONFIG.CHATTER_MS) return;  // 채터링 방지
    this.lastHit[id] = perf;
    this.handler(id, perf, touch);
  },
};

/* =========================================================================
   8. ResultCard — 결과 공유 이미지 (1080×1350, 캔버스 직접 렌더)
   ========================================================================= */
const ResultCard = {
  fontFamily() {
    if (I18n.lang === 'ja') return '"Pretendard JP Variable", "Pretendard Variable", system-ui, sans-serif';
    if (I18n.lang === 'zh') return '"Noto Sans SC", "PingFang SC", "Microsoft YaHei", "Pretendard Variable", sans-serif';
    return '"Pretendard Variable", Pretendard, system-ui, sans-serif';
  },
  async waitFonts(texts) {
    if (!document.fonts || !document.fonts.load) return;
    const sample = texts.join(' ');
    const fams = ['"Pretendard Variable"'];
    if (I18n.lang === 'ja') fams.push('"Pretendard JP Variable"');
    if (I18n.lang === 'zh') fams.push('"Noto Sans SC"');
    const jobs = [];
    fams.forEach(f => [500, 700, 900].forEach(w => jobs.push(document.fonts.load(`${w} 40px ${f}`, sample).catch(() => null))));
    await Promise.race([Promise.all(jobs).then(() => document.fonts.ready), new Promise(r => setTimeout(r, 2500))]);
  },
  rr(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
  },
  fit(ctx, text, weight, size, maxW, fam) {
    let s = size;
    do { ctx.font = `${weight} ${s}px ${fam}`; if (ctx.measureText(text).width <= maxW) break; s -= 2; } while (s > 12);
    return s;
  },
  async render(result) {
    const W = 1080, H = 1350;
    const cv = document.createElement('canvas'); cv.width = W; cv.height = H;
    const ctx = cv.getContext('2d');
    const dark = Theme.resolved() === 'dark';
    const C = n => Theme.color(n);
    const fam = this.fontFamily();
    const numFam = '"Pretendard Variable", Pretendard, system-ui, sans-serif';
    const lvl = t(result.level);
    const date = new Intl.DateTimeFormat(I18n.lang === 'zh' ? 'zh-CN' : I18n.lang, { dateStyle: 'medium' }).format(new Date(result.playedAt));
    const tend = tendencyText(result.avgDeltaMs);
    const texts = [t('title'), t('totalScore'), t('scoreHit'), t('scoreRound'), t('scoreCombo'), t('scoreSpecial'), t('scorePenalty'),
      t('accuracy'), t('maxCombo'), t('maxPossible'), tend, lvl, t('challengeCode', { seed: result.seed }), date, '0123456789,%×·#/+-−'];
    await this.waitFonts(texts);

    // 배경: 라이트 = 파스텔 그라데이션, 다크 = 딥퍼플 + 네온 글로우
    ctx.fillStyle = C('--bg'); ctx.fillRect(0, 0, W, H);
    const blobs = [['--pad-7', 120, 140], ['--pad-9', 980, 260], ['--pad-1', 140, 1200], ['--pad-3', 960, 1150]];
    blobs.forEach(([c, x, y]) => {
      const g = ctx.createRadialGradient(x, y, 0, x, y, 620);
      const col = C(c);
      g.addColorStop(0, hexA(col, dark ? 0.45 : 0.7)); g.addColorStop(1, hexA(col, 0));
      ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    });
    // 도트 패턴
    ctx.fillStyle = dark ? 'rgba(255,255,255,.05)' : 'rgba(43,43,58,.05)';
    for (let y = 30; y < H; y += 40) for (let x = 30 + (y / 40 % 2) * 20; x < W; x += 40) { ctx.beginPath(); ctx.arc(x, y, 3, 0, Math.PI * 2); ctx.fill(); }

    // 카드
    ctx.save();
    ctx.shadowColor = dark ? 'rgba(0,0,0,.5)' : 'rgba(60,40,80,.18)'; ctx.shadowBlur = 50; ctx.shadowOffsetY = 16;
    this.rr(ctx, 60, 60, W - 120, H - 120, 56);
    ctx.fillStyle = dark ? 'rgba(42,38,64,.92)' : 'rgba(255,255,255,.9)'; ctx.fill();
    ctx.restore();

    const text = C('--text'), sub = C('--text-sub');
    ctx.textBaseline = 'alphabetic';
    // 1. 타이틀 + 날짜 (패드 4색 로고)
    const cols = ['--pad-7', '--pad-9', '--pad-1', '--pad-3'].map(C);
    [[0, 0], [1, 0], [0, 1], [1, 1]].forEach(([i, j], k) => { this.rr(ctx, 120 + i * 38, 118 + j * 38, 32, 32, 9); ctx.fillStyle = cols[k]; ctx.fill(); });
    ctx.textAlign = 'left'; ctx.fillStyle = text;
    this.fit(ctx, t('title'), 800, 54, 680, fam);
    ctx.fillText(t('title'), 218, 168);
    ctx.font = `600 28px ${fam}`; ctx.fillStyle = sub; ctx.fillText(date, 220, 204);

    // 2. 총점
    ctx.textAlign = 'center';
    ctx.font = `900 30px ${numFam}`; ctx.fillStyle = sub;
    ctx.fillText(t('totalScore').toUpperCase(), W / 2, 296);
    ctx.fillStyle = text;
    if (dark) { ctx.save(); ctx.shadowColor = C('--pad-7'); ctx.shadowBlur = 40; }
    this.fit(ctx, I18n.fmt(result.total), 900, 160, W - 220, numFam);
    ctx.fillText(I18n.fmt(result.total), W / 2, 432);
    if (dark) ctx.restore();
    const pct = result.maxPossible ? Math.floor(result.total / result.maxPossible * 100) : 0;
    ctx.font = `700 30px ${numFam}`; ctx.fillStyle = sub;
    ctx.fillText(`${I18n.fmt(result.total)} / ${I18n.fmt(result.maxPossible)} (${pct}%)`, W / 2, 482);
    // 진행 바
    this.rr(ctx, 160, 504, W - 320, 14, 7); ctx.fillStyle = dark ? 'rgba(255,255,255,.1)' : 'rgba(43,43,58,.08)'; ctx.fill();
    const grad = ctx.createLinearGradient(160, 0, W - 160, 0);
    cols.forEach((c, i) => grad.addColorStop(i / 3, c));
    this.rr(ctx, 160, 504, Math.max(14, (W - 320) * Math.min(1, pct / 100)), 14, 7); ctx.fillStyle = grad; ctx.fill();
    if (result.fullPerfect) {
      ctx.font = `900 28px ${numFam}`; ctx.fillStyle = C('--perfect'); ctx.fillText('★ ' + t('allPerfect') + ' ★', W / 2, 256);
    }

    // 3. 점수 구성
    const rows = [[t('scoreHit'), result.breakdown.hit], [t('scoreRound'), result.breakdown.round], [t('scoreCombo'), result.breakdown.combo], [t('scoreSpecial'), result.breakdown.special]];
    if (result.wrongHits) rows.push([t('scorePenalty'), -result.breakdown.penalty]);
    rows.push([t('scoreMultiplier'), '× ' + result.breakdown.multiplier.toFixed(2)]);
    let y = 580;
    const rowH = 48;
    rows.forEach(([k, v]) => {
      ctx.textAlign = 'left'; ctx.fillStyle = sub; this.fit(ctx, k, 700, 30, 560, fam); ctx.fillText(k, 140, y);
      ctx.textAlign = 'right'; ctx.fillStyle = typeof v === 'number' && v < 0 ? C('--danger') : text;
      ctx.font = `800 32px ${numFam}`;
      ctx.fillText(typeof v === 'number' ? (v < 0 ? '−' + I18n.fmt(-v) : I18n.fmt(v)) : v, W - 140, y);
      y += rowH;
    });
    ctx.textAlign = 'center'; ctx.fillStyle = text; ctx.font = `700 30px ${fam}`;
    const accLine = `${t('accuracy')} ${result.accuracy.toFixed(1)}%  ·  ${t('maxCombo')} ${result.maxPerfectCombo}`;
    this.fit(ctx, accLine, 700, 30, W - 220, fam);
    ctx.fillText(accLine, W / 2, y + 8);

    // 4. 판정 개수 칩 (패드 색)
    const chips = [['PERFECT', result.counts.perfect, cols[3]], ['GREAT', result.counts.great, cols[2]], ['GOOD', result.counts.good, cols[1]], ['MISS', result.counts.miss, cols[0]]];
    const cy = y + 36, cw = 196, gap = 16, cx0 = (W - (cw * 4 + gap * 3)) / 2;
    chips.forEach(([k, v, c], i) => {
      const x = cx0 + i * (cw + gap);
      this.rr(ctx, x, cy, cw, 92, 24); ctx.fillStyle = c; ctx.fill();
      ctx.fillStyle = '#2F2540'; ctx.textAlign = 'center';
      ctx.font = `800 22px ${numFam}`; ctx.fillText(k, x + cw / 2, cy + 36);
      ctx.font = `900 38px ${numFam}`; ctx.fillText(String(v), x + cw / 2, cy + 76);
    });

    // 5. 라운드 등급 배지 8개
    const gradeCol = { PERFECT: C('--perfect'), GREAT: C('--great'), GOOD: C('--good'), BREAK: C('--miss') };
    const gradeTxt = { PERFECT: 'P', GREAT: 'G', GOOD: 'Go', BREAK: 'X' };
    const by = cy + 92 + 58, bs = 104, bx0 = W / 2 - bs * 3.5;
    result.roundGrades.forEach((gname, i) => {
      const x = bx0 + i * bs;
      ctx.beginPath(); ctx.arc(x, by, 38, 0, Math.PI * 2); ctx.fillStyle = gradeCol[gname]; ctx.fill();
      ctx.fillStyle = gname === 'PERFECT' || gname === 'GREAT' ? '#1A1628' : '#fff';
      ctx.font = `900 28px ${numFam}`; ctx.textAlign = 'center'; ctx.fillText(gradeTxt[gname], x, by + 10);
      ctx.fillStyle = sub; ctx.font = `700 18px ${numFam}`; ctx.fillText('R' + (i + 1), x, by + 64);
    });

    // 6. 타이밍 성향
    if (tend) {
      ctx.fillStyle = text; ctx.textAlign = 'center';
      this.fit(ctx, tend, 800, 36, W - 220, fam);
      ctx.fillText(tend, W / 2, Math.min(by + 116, H - 190));
    }
    // 7. 하단 정보
    const site = /^https?:$/.test(location.protocol) ? location.host : 'rhythm-master.example';
    ctx.fillStyle = sub; ctx.textAlign = 'center';
    const foot1 = `BPM ${result.bpm} · ${lvl} · ${site}`;
    this.fit(ctx, foot1, 700, 26, W - 220, fam); ctx.fillText(foot1, W / 2, H - 130);
    const foot2 = t('challengeCode', { seed: result.seed });
    ctx.fillStyle = text; this.fit(ctx, foot2, 800, 28, W - 220, fam); ctx.fillText(foot2, W / 2, H - 92);

    return new Promise(res => cv.toBlob(b => res(b), 'image/png'));
  },
};
function hexA(color, a) {
  const m = /^#?([0-9a-f]{6})$/i.exec(color.trim());
  if (!m) return color;
  const n = parseInt(m[1], 16);
  return `rgba(${n >> 16 & 255},${n >> 8 & 255},${n & 255},${a})`;
}
function tendencyText(avg) {
  if (avg == null) return '';
  const ms = Math.round(avg);
  const sign = ms > 0 ? '+' : ms < 0 ? '−' : '±';
  const avgStr = t('avgTiming', { ms: sign + Math.abs(ms) });
  if (Math.abs(avg) <= 10) return `±10ms · ${t('tendencyOn')}`;
  return `${avgStr} · ${avg > 0 ? t('tendencyLate') : t('tendencyEarly')}`;
}

/* =========================================================================
   결과 화면 연출 — 점수 촤르륵
   ========================================================================= */
const ResultView = {
  skipped: false, animating: false, waiters: new Set(),
  wait(ms) {
    if (this.skipped) return Promise.resolve();
    return new Promise(res => {
      const done = () => { clearTimeout(id); this.waiters.delete(done); res(); };
      const id = setTimeout(done, ms);
      this.waiters.add(done);
    });
  },
  skip() {
    if (!this.animating || this.skipped) return;
    this.skipped = true;
    Array.from(this.waiters).forEach(f => f());
  },
  countUp(el, to, dur, ease, fmtFn) {
    fmtFn = fmtFn || (v => I18n.fmt(v));
    if (this.skipped || dur <= 0 || to === 0) { el.textContent = fmtFn(to); return Promise.resolve(); }
    return new Promise(res => {
      const t0 = performance.now(); let lastTick = 0;
      const step = () => {
        const k = clamp((performance.now() - t0) / dur, 0, 1);
        if (this.skipped || k >= 1) { el.textContent = fmtFn(to); res(); return; }
        const e = ease(k);
        el.textContent = fmtFn(Math.round(to * e));
        const now = performance.now();
        if (now - lastTick >= 40) { lastTick = now; AudioEngine.countTick(k); }
        requestAnimationFrame(step);
      };
      requestAnimationFrame(step);
    });
  },
  row(cls, label, sub, id) {
    const li = document.createElement('li');
    li.className = 'score-row ' + cls;
    li.innerHTML = `<span class="lbl"></span><span class="val num" id="${id}">0</span>${sub != null ? '<span class="sub"></span>' : ''}`;
    $('.lbl', li).textContent = label;
    if (sub != null) { if (sub instanceof Node) $('.sub', li).appendChild(sub); else $('.sub', li).textContent = sub; }
    return li;
  },
  async play(res, isNewRecord, best) {
    this.skipped = false; this.animating = true;
    const easeOutCubic = k => 1 - Math.pow(1 - k, 3);
    const easeOutExpo = k => (k >= 1 ? 1 : 1 - Math.pow(2, -10 * k));
    const bd = res.breakdown;
    const ul = $('#score-rows'); ul.innerHTML = '';
    $('#total-num').textContent = '0';
    $('#new-record').hidden = true;
    $('#achieve-block').classList.remove('in'); $('#achieve-meter').style.width = '0';
    $('#result-extra').classList.remove('in');
    $('#skip-hint').hidden = false;
    $('#result-meta').textContent = `#${res.seed} · BPM ${res.bpm} · ${t(res.level)}`;
    this.fillExtras(res, best);

    const rows = [];
    rows.push([this.row('', t('scoreHit'), `PERFECT ${res.counts.perfect} · GREAT ${res.counts.great} · GOOD ${res.counts.good}`, 'rv-hit'), bd.hit, 800]);
    const badges = document.createElement('div'); badges.className = 'round-badges';
    const short = { PERFECT: 'P', GREAT: 'G', GOOD: 'Go', BREAK: 'X' };
    res.roundGrades.forEach((g, i) => { const b = document.createElement('span'); b.className = 'rb ' + g; b.textContent = short[g]; b.title = `R${i + 1} ${g}`; badges.appendChild(b); });
    rows.push([this.row('', t('scoreRound'), badges, 'rv-round'), bd.round, 600, 'badges']);
    rows.push([this.row('', t('scoreCombo'), t('maxComboN', { n: res.maxPerfectCombo }), 'rv-combo'), bd.combo, 600]);
    if (bd.special > 0) rows.push([this.row('special', t('scoreSpecial'), res.specials.map(s => (s.i18n ? t(s.i18n) : s.label)).join(' · '), 'rv-special'), bd.special, 700]);
    if (res.wrongHits > 0) rows.push([this.row('penalty', t('scorePenalty'), t('wrongHitCount', { n: res.wrongHits }), 'rv-pen'), -bd.penalty, 500]);
    rows.push([this.row('mult', t('scoreMultiplier'), `${t(res.level)} ×${bd.levelMul.toFixed(1)} · BPM ${res.bpm} ×${bd.bpmMul.toFixed(2)}`, 'rv-mul'), null, 0, 'mult']);
    rows.forEach(([li]) => ul.appendChild(li));

    const rm = reducedMotion();
    if (rm) this.skipped = true;
    for (const [li, value, dur, kind] of rows) {
      li.classList.add('in');
      await this.wait(180);
      const val = $('.val', li);
      if (kind === 'badges') {
        for (const b of $$('.rb', li)) { b.classList.add('stamp'); if (!this.skipped) AudioEngine.tap(); await this.wait(100); }
      }
      if (kind === 'mult') { val.textContent = '× ' + bd.multiplier.toFixed(2); await this.wait(350); continue; }
      if (value < 0) await this.countUp(val, -value, dur, easeOutCubic, v => '−' + I18n.fmt(v));
      else await this.countUp(val, value, dur, easeOutCubic);
      await this.wait(160);
    }
    // 총점: 1.8초 easeOutExpo — 빠르게 돌다가 끝에서 조용히 멈춤 (마무리 효과음·튕김 없음)
    await this.countUp($('#total-num'), res.total, 1800, easeOutExpo);
    this.skipped = true;   // 이후 대기 없이 마무리
    $$('.score-row').forEach(li => li.classList.add('in'));
    $$('.rb').forEach(b => b.classList.add('stamp'));
    const pct = res.maxPossible ? Math.floor(res.total / res.maxPossible * 100) : 0;
    $('#achieve-block').classList.add('in');
    requestAnimationFrame(() => { $('#achieve-meter').style.width = Math.min(100, pct) + '%'; });
    if (isNewRecord) $('#new-record').hidden = false;
    $('#result-extra').classList.add('in');
    $('#skip-hint').hidden = true;
    this.animating = false;
  },
  fillExtras(res, best) {
    const pct = res.maxPossible ? Math.floor(res.total / res.maxPossible * 100) : 0;
    $('#achieve-text').textContent = `${I18n.fmt(res.total)} / ${I18n.fmt(res.maxPossible)} (${pct}%)`;
    $('#st-acc').textContent = res.accuracy.toFixed(1) + '%';
    $('#st-combo').textContent = String(res.maxPerfectCombo);
    $('#st-tendency').textContent = tendencyText(res.avgDeltaMs) || '—';
    $('#st-best').textContent = I18n.fmt(best);
    $('#st-max').textContent = I18n.fmt(res.maxPossible);
    const c = res.counts, tot = Math.max(1, res.totalNotes);
    const parts = [['PERFECT', c.perfect, '--perfect'], ['GREAT', c.great, '--great'], ['GOOD', c.good, '--good'], ['MISS', c.miss, '--miss']];
    $('#dist-bar').innerHTML = parts.map(([, v, col]) => `<i style="width:${(v / tot * 100).toFixed(2)}%;background:var(${col})"></i>`).join('');
    $('#dist-legend').innerHTML = parts.map(([k, v, col]) => `<span style="--c:var(${col})">${k} ${v}</span>`).join('') +
      (res.wrongHits ? `<span style="--c:var(--danger)">✕ ${res.wrongHits}</span>` : '');
    $('#st-server-card').hidden = true;
  },
  showServer(stats) {
    if (!stats || !stats.plays) return;
    $('#st-server').textContent = t('serverStats', { plays: I18n.fmt(stats.plays), pct: stats.topPercent });
    $('#st-server-card').hidden = false;
  },
};

/* =========================================================================
   타이밍 보정 — 메트로놈 8박에 맞춰 탭 → 평균(중앙값) 오차를 userOffset 으로
   ========================================================================= */
const Calibration = {
  active: false,
  LEAD: 4, TAPS: 8, BPM: 90,
  async start() {
    const ok = await AudioEngine.ensure();
    if (!ok) { UI.toast(t('noAudio')); return; }
    $('#settings-main').hidden = true; $('#calib-panel').hidden = false;
    const dots = $('#calib-dots'); dots.innerHTML = '';
    for (let i = 0; i < this.LEAD + this.TAPS; i++) { const d = document.createElement('i'); if (i < this.LEAD) d.className = 'lead'; dots.appendChild(d); }
    this.dots = $$('i', dots);
    this.beat = 60 / this.BPM;
    this.origin = AudioEngine.ctx.currentTime + 0.4;
    for (let i = 0; i < this.LEAD + this.TAPS; i++) AudioEngine.tick(this.origin + i * this.beat, i % 4 === 0, true);
    this.deltas = []; this.used = new Set();
    this.active = true;
    $('#calib-status').textContent = t('calibListen');
    const loop = () => {
      if (!this.active) return;
      const now = AudioEngine.audible();
      const k = Math.floor((now - this.origin) / this.beat);
      this.dots.forEach((d, i) => d.classList.toggle('beat', i === k));
      if (k >= this.LEAD && k < this.LEAD + this.TAPS) $('#calib-status').textContent = t('calibTap', { n: Math.min(this.TAPS, this.deltas.length + 1) });
      if (now > this.origin + (this.LEAD + this.TAPS) * this.beat + 0.4) { this.finish(); return; }
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  },
  tap(ts) {
    if (!this.active) return;
    AudioEngine.drum(9);
    const tt = AudioEngine.audible(InputManager.normTs(ts));
    const k = Math.round((tt - this.origin) / this.beat);
    if (k < this.LEAD || k >= this.LEAD + this.TAPS || this.used.has(k)) return;
    const d = tt - (this.origin + k * this.beat);
    if (Math.abs(d) > this.beat * 0.45) return;
    this.used.add(k); this.deltas.push(d);
    this.dots[k].classList.add('hit');
  },
  finish() {
    this.active = false;
    if (this.deltas.length < 4) { $('#calib-status').textContent = t('calibFail'); return; }
    const s = this.deltas.slice().sort((a, b) => a - b);
    const med = s.length % 2 ? s[(s.length - 1) / 2] : (s[s.length / 2 - 1] + s[s.length / 2]) / 2;
    const ms = clamp(Math.round(med * 1000 / 5) * 5, -CONFIG.OFFSET_MAX_MS, CONFIG.OFFSET_MAX_MS);
    Settings.set('offsetMs', ms);
    UI.syncSettings();
    $('#calib-status').textContent = t('calibDone', { ms: (ms > 0 ? '+' : '') + ms });
    setTimeout(() => { if (!this.active) this.close(); }, 1400);
  },
  close() {
    this.active = false;
    $('#settings-main').hidden = false; $('#calib-panel').hidden = true;
  },
};

/* =========================================================================
   UI 도우미 — 모달, 토스트, 설정 폼
   ========================================================================= */
const UI = {
  openModal(id) {
    const m = $('#' + id); m.hidden = false;
    this.lastFocus = document.activeElement;
    const f = $('[data-close]', m); if (f) f.focus({ preventScroll: true });
  },
  closeModal(m) {
    if (typeof m === 'string') m = $('#' + m);
    if (!m || m.hidden) return;
    if (m.id === 'modal-settings') Calibration.close();
    m.hidden = true;
    if (this.lastFocus && this.lastFocus.focus) this.lastFocus.focus({ preventScroll: true });
  },
  openModalEl() { return $$('.modal').find(m => !m.hidden); },
  toast(msg) {
    const el = $('#toast'); el.textContent = msg; el.classList.add('show');
    clearTimeout(this._tt); this._tt = setTimeout(() => el.classList.remove('show'), 2200);
  },
  syncSettings() {
    const d = Settings.data;
    $('#set-bpm').value = d.bpm; $('#out-bpm').textContent = d.bpm;
    $('#set-volume').value = Math.round(d.volume * 100); $('#out-volume').textContent = Math.round(d.volume * 100) + '%';
    $('#set-offset').value = d.offsetMs; $('#out-offset').textContent = (d.offsetMs > 0 ? '+' : '') + d.offsetMs + 'ms';
    $('#set-metronome').checked = d.metronome;
    $('#set-vibration').checked = d.vibration;
    $$('#set-level button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.v === d.level)));
    Theme.apply();
  },
  initSettings() {
    $('#set-bpm').addEventListener('input', e => { Settings.set('bpm', +e.target.value); $('#out-bpm').textContent = e.target.value; });
    $('#set-volume').addEventListener('input', e => { const v = +e.target.value / 100; Settings.set('volume', v); AudioEngine.setVolume(v); $('#out-volume').textContent = e.target.value + '%'; });
    $('#set-volume').addEventListener('change', () => AudioEngine.drum(9));
    $('#set-offset').addEventListener('input', e => { Settings.set('offsetMs', +e.target.value); UI.syncSettings(); });
    $('#set-metronome').addEventListener('change', e => Settings.set('metronome', e.target.checked));
    $('#set-vibration').addEventListener('change', e => Settings.set('vibration', e.target.checked));
    $('#set-level').addEventListener('click', e => {
      const b = e.target.closest('button'); if (!b) return;
      const prev = Settings.data.level, next = b.dataset.v;
      // 난이도별 기본 BPM (쉬움 75): 사용자가 BPM 을 직접 바꾸지 않았다면 함께 조정
      if (Settings.data.bpm === CONFIG.LEVEL_DEFAULT_BPM[prev]) Settings.set('bpm', CONFIG.LEVEL_DEFAULT_BPM[next]);
      Settings.set('level', next); UI.syncSettings();
    });
    $('#set-theme').addEventListener('click', e => { const b = e.target.closest('button'); if (b) Theme.set(b.dataset.v); });
    $('#btn-calib').addEventListener('click', () => Calibration.start());
    $('#btn-calib-cancel').addEventListener('click', () => Calibration.close());
    $('#calib-pad').addEventListener('pointerdown', e => { e.preventDefault(); Calibration.tap(e.timeStamp); });
    if (!('vibrate' in navigator)) $('#vibration-item').hidden = true;
  },
};

/* =========================================================================
   API — 서버 기록(선택). 파일로 직접 열었거나 서버가 없으면 조용히 생략
   ========================================================================= */
const Api = {
  enabled: /^https?:$/.test(location.protocol),
  async submit(res) {
    if (!this.enabled) return null;
    try {
      const r = await fetch('api/scores', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ seed: res.seed, bpm: res.bpm, level: res.level, score: res.total,
          accuracy: Math.round(res.accuracy * 100) / 100, maxCombo: res.maxPerfectCombo }),
      });
      return r.ok ? await r.json() : null;
    } catch (e) { return null; }
  },
};

/* =========================================================================
   12. App — 화면 전환 상태머신 (title → countIn → playing → paused → result)
   ========================================================================= */
const App = {
  state: 'title',
  game: null,
  challenge: null,
  lastResult: null,
  shareBlob: null,
  wakeLock: null,

  init() {
    Settings.load();
    Theme.init(Settings.data.theme);
    AudioEngine.volume = Settings.data.volume;
    Renderer.build();
    // 언어 선택 옵션
    $$('.lang-select').forEach(sel => {
      sel.innerHTML = LANGS.map(([v, n]) => `<option value="${v}">${n}</option>`).join('');
      sel.addEventListener('change', e => I18n.set(e.target.value, true));
    });
    I18n.set(I18n.detect(), false);
    this.readChallenge();
    UI.initSettings(); UI.syncSettings();
    InputManager.init((id, perf, touch) => this.onPad(id, perf, touch));
    this.bind();
    this.refreshTitle();
    if (!AudioEngine.supported) $('#no-audio-msg').hidden = false;
    const iOS = /iP(hone|ad|od)/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    if (iOS) $('#ios-msg').hidden = false;
    requestAnimationFrame(ts => this.loop(ts));
  },

  readChallenge() {
    const q = new URLSearchParams(location.search);
    if (!q.has('seed')) return;
    const seed = parseInt(q.get('seed'), 10);
    if (!Number.isFinite(seed) || seed < 0 || seed > 0xFFFFFFFF) return;
    let bpm = parseInt(q.get('bpm'), 10);
    bpm = Number.isFinite(bpm) ? clamp(Math.round(bpm / 5) * 5, CONFIG.BPM_MIN, CONFIG.BPM_MAX) : CONFIG.DEFAULT_BPM;
    const level = LEVELS.includes(q.get('lv')) ? q.get('lv') : 'normal';
    this.challenge = { seed, bpm, level };
  },
  challengeUrl(res) {
    const u = new URL(location.href);
    u.search = ''; u.hash = '';
    u.searchParams.set('seed', res.seed); u.searchParams.set('bpm', res.bpm); u.searchParams.set('lv', res.level);
    return u.toString();
  },

  bind() {
    $('#btn-start').addEventListener('click', () => this.start());
    $('#btn-howto').addEventListener('click', () => { AudioEngine.tap(); UI.openModal('modal-howto'); });
    $('#btn-settings').addEventListener('click', () => { AudioEngine.tap(); UI.syncSettings(); UI.openModal('modal-settings'); });
    $('#btn-clear-challenge').addEventListener('click', () => {
      this.challenge = null;
      try { history.replaceState(null, '', location.pathname); } catch (e) { /* noop */ }
      this.refreshTitle();
    });
    $$('.theme-toggle').forEach(b => b.addEventListener('click', () => Theme.toggle()));
    $$('.modal').forEach(m => {
      m.addEventListener('click', e => { if (e.target === m || e.target.closest('[data-close]')) UI.closeModal(m); });
    });
    $('#hub').addEventListener('pointerdown', e => { e.preventDefault(); this.pause(); });
    $('#btn-resume').addEventListener('click', () => this.resume());
    $('#btn-pause-retry').addEventListener('click', () => this.retry());
    $('#btn-pause-home').addEventListener('click', () => this.home());
    $('#btn-retry').addEventListener('click', () => this.retry());
    $('#btn-home').addEventListener('click', () => this.home());
    $('#btn-share').addEventListener('click', () => this.share());
    $('#btn-challenge').addEventListener('click', () => this.copyChallenge());
    $('#screen-result').addEventListener('pointerdown', () => ResultView.skip());

    document.addEventListener('keydown', e => this.onKey(e));
    document.addEventListener('keyup', e => { const id = KEY_TO_PAD[e.code]; if (id) Renderer.setPressed(id, false); });
    document.addEventListener('visibilitychange', () => { if (document.hidden) this.pause(); });
    window.addEventListener('pagehide', () => this.pause());
    // 첫 상호작용 때 오디오 컨텍스트 준비 (iOS 잠금 해제)
    const prime = () => { AudioEngine.ensure(); window.removeEventListener('pointerdown', prime, true); window.removeEventListener('keydown', prime, true); };
    window.addEventListener('pointerdown', prime, true);
    window.addEventListener('keydown', prime, true);
  },

  onKey(e) {
    if (Calibration.active) {
      if (KEY_TO_PAD[e.code] || e.code === 'Space') { e.preventDefault(); if (!e.repeat) Calibration.tap(e.timeStamp); }
      else if (e.code === 'Escape') Calibration.close();
      return;
    }
    const modal = UI.openModalEl();
    if (modal) { if (e.code === 'Escape') UI.closeModal(modal); return; }
    const inGame = this.state === 'countIn' || this.state === 'playing';
    const pad = KEY_TO_PAD[e.code];
    if (pad) {
      if (inGame) { e.preventDefault(); if (!e.repeat) InputManager.press(pad, e.timeStamp, false); }
      return;
    }
    const onControl = e.target && e.target.closest && e.target.closest('button, select, input, a');
    if (e.code === 'Space') {
      if (inGame) { e.preventDefault(); this.pause(); }
      else if (this.state === 'paused') { e.preventDefault(); this.resume(); }
    } else if (e.code === 'Escape') {
      if (inGame) this.pause(); else if (this.state === 'paused') this.resume();
    } else if (e.code === 'Enter' || e.code === 'NumpadEnter') {
      if (onControl && e.code === 'Enter') return;   // 포커스된 버튼은 기본 동작
      if (this.state === 'title') { e.preventDefault(); this.start(); }
      else if (this.state === 'result') { e.preventDefault(); if (ResultView.animating) ResultView.skip(); else this.retry(); }
      else if (this.state === 'paused') { e.preventDefault(); this.resume(); }
    }
  },

  onPad(id, perf, touch) {
    let res = null;
    if (this.game && (this.state === 'countIn' || this.state === 'playing')) res = this.game.onPad(id, perf);
    AudioEngine.drum(id, res === 'perfect');
    if (touch && Settings.data.vibration && navigator.vibrate) { try { navigator.vibrate(10); } catch (e) { /* noop */ } }
  },

  showScreen(name) {
    $$('.screen').forEach(s => s.classList.toggle('active', s.id === 'screen-' + name));
    document.body.classList.toggle('playing', name === 'game');
    if (name === 'result') $('#screen-result').scrollTop = 0;
  },

  refreshTitle() {
    const best = Storage.get('rmc.best.v1', 0);
    $('#title-best').hidden = !(best > 0);
    $('#title-best-n').textContent = I18n.fmt(best || 0);
    const c = this.challenge;
    $('#challenge-card').hidden = !c;
    if (c) $('#challenge-info').textContent = t('challengeInfo', { seed: c.seed, bpm: c.bpm, level: t(c.level) });
  },
  onLanguageChanged() {
    if (this.state === 'title') this.refreshTitle();
    if (this.state === 'result' && this.lastResult && !ResultView.animating) {
      ResultView.fillExtras(this.lastResult, Storage.get('rmc.best.v1', 0));
      $('#result-meta').textContent = `#${this.lastResult.seed} · BPM ${this.lastResult.bpm} · ${t(this.lastResult.level)}`;
      this.renderShare();
    }
    if (Renderer.game) Renderer.hubScore.textContent = I18n.fmt(Renderer.displayScore || 0);
  },

  async start(params) {
    if (this._starting) return;
    this._starting = true;
    try {
      await AudioEngine.ensure();       // 사용자 탭 시점에 생성/resume (iOS)
      AudioEngine.setVolume(Settings.data.volume);
      const p = params || (this.challenge ? Object.assign({}, this.challenge)
        : { seed: randomSeed(), bpm: Settings.data.bpm, level: Settings.data.level });
      if (this.game) this.game.stop();
      this.game = new Game(p);
      Renderer.reset(this.game);
      $('#pause-overlay').hidden = true;
      this.showScreen('game');
      this.game.begin(0);
      this.state = 'countIn';
      this.requestWakeLock();
    } finally { this._starting = false; }
  },
  retry() {
    // 도전 모드면 같은 리듬, 아니면 새 리듬
    this.start(this.challenge ? Object.assign({}, this.challenge) : null);
  },
  home() {
    if (this.game) this.game.stop();
    this.game = null; Renderer.game = null;
    $('#pause-overlay').hidden = true;
    this.state = 'title';
    this.releaseWakeLock();
    this.refreshTitle();
    this.showScreen('title');
  },
  pause() {
    if (!this.game || (this.state !== 'countIn' && this.state !== 'playing')) return;
    if (!this.game.pause()) return;
    this.state = 'paused';
    $$('.pad.pressed').forEach(p => p.classList.remove('pressed'));
    $('#pause-overlay').hidden = false;
    $('#btn-resume').focus({ preventScroll: true });
  },
  async resume() {
    if (this.state !== 'paused' || !this.game) return;
    await AudioEngine.ensure();
    $('#pause-overlay').hidden = true;
    this.game.resume();
    Renderer.reset(this.game);
    this.state = 'countIn';
    this.requestWakeLock();
  },
  onAudioInterrupted() {
    if (this.state === 'countIn' || this.state === 'playing') this.pause();
  },

  loop() {
    requestAnimationFrame(ts => this.loop(ts));
    const g = this.game;
    if (!g) return;
    if (this.state === 'countIn' || this.state === 'playing' || this.state === 'ending') {
      const now = AudioEngine.audible();
      g.update(now);
      if (g.state === 'playing' && this.state === 'countIn') this.state = 'playing';
      if (g.state === 'ending') this.state = 'ending';
      Renderer.frame(now);
      if (g.state === 'ending' && performance.now() >= g.endAt) this.showResult();
    }
  },

  showResult() {
    const g = this.game;
    g.state = 'done';
    const res = g.buildResult();
    this.lastResult = res;
    const prevBest = Storage.get('rmc.best.v1', 0) || 0;
    const isNew = res.total > prevBest && res.total > 0;
    if (isNew) Storage.set('rmc.best.v1', res.total);
    this.state = 'result';
    this.releaseWakeLock();
    this.showScreen('result');
    ResultView.play(res, isNew, Math.max(prevBest, res.total));
    this.renderShare();
    Api.submit(res).then(stats => { if (this.lastResult === res) ResultView.showServer(stats); });
  },

  async renderShare() {
    const res = this.lastResult; if (!res) return;
    this.shareBlob = null;
    const token = (this._shareToken = (this._shareToken || 0) + 1);
    try {
      const blob = await ResultCard.render(res);
      if (token !== this._shareToken || !blob) return;
      this.shareBlob = blob;
      const img = $('#share-thumb');
      if (img.dataset.url) URL.revokeObjectURL(img.dataset.url);
      const url = URL.createObjectURL(blob);
      img.src = url; img.dataset.url = url; img.alt = t('title') + ' ' + I18n.fmt(res.total);
    } catch (e) { console.warn('share image failed', e); }
  },
  async share() {
    const res = this.lastResult; if (!res) return;
    if (!this.shareBlob) await this.renderShare();
    const blob = this.shareBlob; if (!blob) return;
    const file = new File([blob], 'rhythm-master-result.png', { type: 'image/png' });
    const coarse = window.matchMedia && matchMedia('(pointer: coarse)').matches;
    if (coarse && navigator.canShare && navigator.share) {
      try {
        if (navigator.canShare({ files: [file] })) {
          await navigator.share({ files: [file], title: t('title'), text: t('shareText', { score: I18n.fmt(res.total) }) + '\n' + this.challengeUrl(res) });
          return;
        }
      } catch (e) { if (e && e.name === 'AbortError') return; }
    }
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = 'rhythm-master-result.png';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    UI.toast(t('imageSaved'));
  },
  async copyChallenge() {
    const res = this.lastResult; if (!res) return;
    const url = this.challengeUrl(res);
    const text = t('shareText', { score: I18n.fmt(res.total) }) + '\n' + url;
    let ok = false;
    try { if (navigator.clipboard && window.isSecureContext) { await navigator.clipboard.writeText(text); ok = true; } } catch (e) { /* fallthrough */ }
    if (!ok) {
      const ta = document.createElement('textarea'); ta.value = text; ta.setAttribute('readonly', '');
      ta.style.position = 'fixed'; ta.style.opacity = '0'; document.body.appendChild(ta); ta.select();
      try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
      ta.remove();
    }
    if (ok) UI.toast(t('linkCopied'));
    else window.prompt(t('copyFail'), url);
  },
  async requestWakeLock() {
    try { if ('wakeLock' in navigator && !this.wakeLock) { this.wakeLock = await navigator.wakeLock.request('screen'); this.wakeLock.addEventListener('release', () => { this.wakeLock = null; }); } } catch (e) { /* 지원 안 함 */ }
  },
  releaseWakeLock() { try { if (this.wakeLock) this.wakeLock.release(); } catch (e) { /* noop */ } this.wakeLock = null; },
};

App.init();
</script>
