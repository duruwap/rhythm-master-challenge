<!doctype html>
<html lang="ko" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#FFF8F0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="두근거리는 패드를 박자에 맞춰 누르는 드럼 리듬 연습 게임">
<title>리듬 마스터 챌린지</title>
<link rel="icon" href="static/favicon.svg" type="image/svg+xml">
<script>
/* 렌더 전에 테마를 적용해 깜빡임(FOUC) 방지 */
(function () {
  var dark = false;
  try {
    var s = JSON.parse(localStorage.getItem('rmc.settings.v1') || '{}');
    var th = s.theme || 'system';
    dark = th === 'dark' || (th === 'system' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
  } catch (e) {
    dark = !!(window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
  }
  document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
})();
</script>
<link rel="stylesheet" href="static/fonts/pretendard/pretendardvariable-dynamic-subset.css">
<style>
/* =========================================================================
   디자인 토큰
   ========================================================================= */
:root {
  --font-num: 'Pretendard Variable', Pretendard, -apple-system, BlinkMacSystemFont, system-ui, 'Segoe UI', Roboto, sans-serif;
  --font-lang: 'Pretendard Variable', Pretendard;
  --font: var(--font-lang), -apple-system, BlinkMacSystemFont, system-ui, 'Segoe UI', Roboto,
          'Hiragino Sans', 'Noto Sans JP', 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', 'Apple SD Gothic Neo', sans-serif;

  --bg: #FFF8F0;
  --bg-2: #FFEFE3;
  --surface: #FFFFFF;
  --surface-2: #F7F3FB;
  --glass: rgba(255, 255, 255, .72);
  --glass-border: rgba(255, 255, 255, .9);
  --text: #2B2B3A;
  --text-sub: #6B6B80;
  --line: rgba(43, 43, 58, .10);
  --shadow-1: 0 1px 2px rgba(60, 40, 80, .06), 0 8px 24px rgba(60, 40, 80, .08);
  --shadow-2: 0 2px 6px rgba(60, 40, 80, .08), 0 20px 48px rgba(60, 40, 80, .14);
  --accent: #7C5CFF;
  --accent-ink: #FFFFFF;
  --danger: #E5484D;

  --pad-7: #FF9EB5;
  --pad-9: #8FD3FF;
  --pad-1: #9EF0C8;
  --pad-3: #FFE38A;
  --pad-inactive: #D9D6E0;
  --pad-ink: #2F2540;
  --pad-ring: rgba(43, 43, 58, .55);
  --glow-spread: 10px;
  --glow-blur: 30px;

  --perfect: #F5B700;
  --great: #2DBE6C;
  --good: #3D8BFF;
  --miss: #9A9AA8;

  --radius-pad: clamp(18px, 4vmin, 34px);
  --radius-card: 22px;
  --ease-out-back: cubic-bezier(.34, 1.56, .64, 1);
  --safe-t: env(safe-area-inset-top, 0px);
  --safe-r: env(safe-area-inset-right, 0px);
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-l: env(safe-area-inset-left, 0px);
}
:root[data-theme="dark"] {
  --bg: #1E1B2E;
  --bg-2: #25213A;
  --surface: #2A2640;
  --surface-2: #332E4D;
  --glass: rgba(42, 38, 64, .72);
  --glass-border: rgba(255, 255, 255, .08);
  --text: #F3F0FF;
  --text-sub: #B8B3D1;
  --line: rgba(243, 240, 255, .10);
  --shadow-1: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px rgba(0, 0, 0, .25);
  --shadow-2: 0 2px 6px rgba(0, 0, 0, .35), 0 20px 48px rgba(0, 0, 0, .45);
  --accent: #9D85FF;
  --accent-ink: #15122A;
  --danger: #FF6B70;

  --pad-7: #E0708F;
  --pad-9: #5AAEE0;
  --pad-1: #5FCB98;
  --pad-3: #E3BE55;
  --pad-inactive: #3B3752;
  --pad-ink: #1A1628;
  --pad-ring: rgba(255, 255, 255, .8);
  --glow-spread: 18px;
  --glow-blur: 48px;

  --perfect: #FFC51A;
  --great: #43D985;
  --good: #5C9FFF;
  --miss: #ACACBA;
}
html[lang="ja"] { --font-lang: 'Pretendard JP Variable', 'Pretendard Variable'; }
html[lang="zh"] { --font-lang: 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei'; }

/* =========================================================================
   기본
   ========================================================================= */
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
html { background: var(--bg); color-scheme: light; }
:root[data-theme="dark"] { color-scheme: dark; }
body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  overflow: hidden;
  overscroll-behavior: none;
  -webkit-tap-highlight-color: transparent;
  -webkit-user-select: none;
  user-select: none;
  touch-action: manipulation;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  word-break: keep-all;
  overflow-wrap: anywhere;
}
button, select, input { font: inherit; color: inherit; }
button { cursor: pointer; }
[hidden] { display: none !important; }
.num { font-family: var(--font-num); font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
.en { font-family: var(--font-num); }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

#app { position: fixed; inset: 0; }
.screen {
  position: absolute; inset: 0;
  display: none; flex-direction: column;
  padding: var(--safe-t) var(--safe-r) var(--safe-b) var(--safe-l);
}
.screen.active { display: flex; animation: screenIn .28s ease-out; }
@keyframes screenIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

/* 배경 블롭 (시작/결과 화면) */
.bg-blobs { position: fixed; inset: 0; z-index: -1; overflow: hidden; pointer-events: none; background: var(--bg); }
.bg-blobs i { position: absolute; width: 60vmax; height: 60vmax; border-radius: 50%; filter: blur(70px); opacity: .45; animation: drift 18s ease-in-out infinite alternate; }
:root[data-theme="dark"] .bg-blobs i { opacity: .28; }
.bg-blobs i:nth-child(1) { background: var(--pad-7); left: -20vmax; top: -22vmax; }
.bg-blobs i:nth-child(2) { background: var(--pad-9); right: -24vmax; top: -10vmax; animation-delay: -4s; }
.bg-blobs i:nth-child(3) { background: var(--pad-1); left: -18vmax; bottom: -26vmax; animation-delay: -9s; }
.bg-blobs i:nth-child(4) { background: var(--pad-3); right: -20vmax; bottom: -24vmax; animation-delay: -13s; }
@keyframes drift { to { transform: translate(6vmax, 4vmax) scale(1.08); } }
body.playing .bg-blobs { display: none; }

/* 공통 버튼 */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 48px; min-width: 120px; padding: 12px 20px;
  border: 1px solid var(--line); border-radius: 999px;
  background: var(--surface); color: var(--text);
  font-weight: 700; font-size: clamp(14px, 3.6vw, 16px); line-height: 1.2; text-align: center;
  box-shadow: var(--shadow-1);
  transition: transform .12s var(--ease-out-back), background .2s, box-shadow .2s;
}
.btn:hover { box-shadow: var(--shadow-2); }
.btn:active { transform: scale(.96); }
.btn-primary { background: var(--text); color: var(--bg); border-color: transparent; }
.btn-accent { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.btn-big { min-height: 64px; font-size: clamp(18px, 5vw, 22px); padding: 16px 36px; min-width: min(280px, 80vw); font-weight: 800; }
.btn-ghost { background: transparent; box-shadow: none; }
.icon-btn {
  width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line);
  display: inline-grid; place-items: center; background: var(--glass);
  -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
  font-size: 18px; box-shadow: var(--shadow-1);
  transition: transform .12s var(--ease-out-back);
}
.icon-btn:active { transform: scale(.92); }
.pill-select {
  position: relative; display: inline-flex; align-items: center; gap: 6px;
  height: 44px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--line);
  background: var(--glass); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
  box-shadow: var(--shadow-1); font-weight: 700; font-size: 14px;
}
.pill-select select {
  appearance: none; -webkit-appearance: none; border: 0; background: transparent;
  font-weight: 700; padding-right: 2px; cursor: pointer; outline: none;
}
.pill-select select option { color: #2B2B3A; background: #fff; }

/* =========================================================================
   시작 화면
   ========================================================================= */
#screen-title { align-items: center; overflow-y: auto; touch-action: pan-y; }
.topbar {
  width: 100%; max-width: 960px; display: flex; justify-content: flex-end; gap: 8px;
  padding: 14px 16px 0;
}
.title-main {
  flex: 1; width: 100%; max-width: 560px; padding: 12px 20px 8px;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; text-align: center;
}
.logo-mark {
  display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px;
  width: clamp(112px, 30vw, 148px); aspect-ratio: 1; position: relative;
}
.logo-mark span {
  border-radius: 30%; box-shadow: inset 0 -5px 0 rgba(0,0,0,.08), 0 6px 16px rgba(60,40,80,.15);
  animation: logoBeat 2.67s infinite; /* 90 BPM × 4박 */
  display: grid; place-items: center; font-size: clamp(22px, 6vw, 30px); color: var(--pad-ink); font-weight: 800;
}
.logo-mark span:nth-child(1) { background: var(--pad-7); animation-delay: 0s; }
.logo-mark span:nth-child(2) { background: var(--pad-9); animation-delay: .667s; }
.logo-mark span:nth-child(4) { background: var(--pad-3); animation-delay: 1.333s; }
.logo-mark span:nth-child(3) { background: var(--pad-1); animation-delay: 2s; }
@keyframes logoBeat { 0% { transform: scale(1.12); filter: brightness(1.08); } 8% { transform: scale(1); filter: none; } 100% { transform: scale(1); } }
.logo-mark::after {
  content: ''; position: absolute; left: 50%; top: 50%; width: 26%; height: 26%;
  transform: translate(-50%, -50%); border-radius: 50%; background: var(--text);
  box-shadow: 0 0 0 5px var(--bg);
}
.title-text h1 {
  margin: 0; font-weight: 850; font-size: clamp(30px, 8.4vw, 46px); line-height: 1.12; letter-spacing: -.03em;
}
.title-text p { margin: 8px 0 0; color: var(--text-sub); font-size: clamp(14px, 3.8vw, 17px); font-weight: 500; }
.best-card {
  display: inline-flex; align-items: center; gap: 10px; padding: 8px 16px; border-radius: 999px;
  background: var(--glass); border: 1px solid var(--glass-border); box-shadow: var(--shadow-1);
  -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); font-weight: 700; font-size: 14px;
}
.best-card b { font-size: 17px; }
.challenge-card {
  width: 100%; padding: 14px 16px; border-radius: var(--radius-card); text-align: left;
  background: linear-gradient(135deg, color-mix(in srgb, var(--pad-7) 35%, var(--surface)), color-mix(in srgb, var(--pad-9) 35%, var(--surface)));
  border: 1px solid var(--line); box-shadow: var(--shadow-1);
  display: flex; align-items: center; gap: 12px;
}
.challenge-card .c-body { flex: 1; min-width: 0; }
.challenge-card b { display: block; font-size: 16px; }
.challenge-card span { font-size: 13px; color: var(--text-sub); font-weight: 600; }
.challenge-card button { min-width: 0; min-height: 36px; padding: 6px 12px; font-size: 13px; box-shadow: none; }
.title-actions { display: flex; flex-direction: column; align-items: center; gap: 12px; width: 100%; }
.title-actions .row { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
.title-foot { padding: 8px 20px 18px; text-align: center; color: var(--text-sub); font-size: 13px; line-height: 1.6; max-width: 560px; }
.title-foot p { margin: 0; }
.title-foot .warn { color: var(--danger); font-weight: 700; }
.kbd-only { display: none; }
@media (hover: hover) and (pointer: fine) { .kbd-only { display: block; } }
kbd {
  font-family: var(--font-num); font-weight: 700; font-size: .92em; padding: 1px 6px; border-radius: 6px;
  border: 1px solid var(--line); border-bottom-width: 2px; background: var(--surface);
}

/* =========================================================================
   플레이 화면 — 4분할 패드 + 중앙 허브만 표시
   ========================================================================= */
#screen-game { background: var(--bg); }
.stage {
  position: relative; flex: 1; min-height: 0;
  display: grid; place-items: center;
  padding: 8px;
  container-type: size;
}
.pads {
  position: relative;
  display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr;
  gap: clamp(8px, 1.6vmin, 14px);
  width: 100%; height: 100%;
}
/* 넓은 화면(PC·가로 태블릿)에서는 너무 납작해지지 않게 */
@container (min-aspect-ratio: 3/2) { .pads { width: min(100cqw, 150cqh); } }
@container (max-aspect-ratio: 1/2) { .pads { height: min(100cqh, 200cqw); } }

.pad {
  position: relative; min-width: 0; min-height: 0;
  touch-action: none; -webkit-touch-callout: none;
  container-type: size; outline: none; cursor: pointer;
}
.pad[data-pad="7"] { --pad: var(--pad-7); }
.pad[data-pad="9"] { --pad: var(--pad-9); }
.pad[data-pad="1"] { --pad: var(--pad-1); }
.pad[data-pad="3"] { --pad: var(--pad-3); }
.pad-body { position: absolute; inset: 0; will-change: transform; transition: opacity .25s; }
.pad-glow {
  position: absolute; inset: 0; border-radius: var(--radius-pad); opacity: 0; pointer-events: none;
  box-shadow: 0 0 var(--glow-blur) var(--glow-spread) var(--pad);
  will-change: opacity;
}
.pad-ring {
  position: absolute; inset: 0; border-radius: var(--radius-pad); pointer-events: none; opacity: 0;
  border: clamp(3px, 1.2cqmin, 6px) solid var(--pad-ring);
  will-change: transform, opacity;
}
.pad-face {
  position: absolute; inset: 0; border-radius: var(--radius-pad); overflow: hidden;
  background:
    radial-gradient(120% 90% at 30% 0%, rgba(255,255,255,.55), rgba(255,255,255,0) 55%),
    var(--pad);
  box-shadow: inset 0 -6px 0 rgba(0,0,0,.08), 0 6px 0 rgba(0,0,0,.10), 0 14px 30px rgba(60,40,80,.12);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  color: var(--pad-ink);
  transition: transform 90ms ease-out, box-shadow 90ms ease-out;
}
:root[data-theme="dark"] .pad-face {
  background: radial-gradient(120% 90% at 30% 0%, rgba(255,255,255,.22), rgba(255,255,255,0) 55%), var(--pad);
  box-shadow: inset 0 -6px 0 rgba(0,0,0,.18), 0 6px 0 rgba(0,0,0,.35);
}
.pad.pressed .pad-face {
  transform: translateY(4px) scale(.94);
  box-shadow: inset 0 -2px 0 rgba(0,0,0,.08), 0 1px 0 rgba(0,0,0,.1);
  transition-duration: 40ms;
}
.pad.inactive .pad-body { opacity: .35; }
.pad.inactive .pad-face { background: var(--pad-inactive); }
.pad.inactive .pad-icon, .pad.inactive .pad-dots.cur { visibility: hidden; }

.pad-icon {
  font-size: clamp(34px, 34cqmin, 140px); line-height: 1; font-weight: 400;
  font-family: 'Segoe UI Symbol', 'Apple Symbols', 'Noto Music', 'Noto Sans Symbols 2', var(--font);
  will-change: transform;
  text-shadow: 0 2px 0 rgba(255,255,255,.35);
}
.pad-icon.done { opacity: .35; }
.pad-key {
  position: absolute; left: 6cqmin; top: 5cqmin; z-index: 1;
  font-family: var(--font-num); font-weight: 800; font-size: clamp(12px, 7cqmin, 22px);
  padding: .1em .45em; border-radius: .5em; background: rgba(255,255,255,.45); color: var(--pad-ink);
}
:root[data-theme="dark"] .pad-key { background: rgba(0,0,0,.18); }
@media (hover: none) and (pointer: coarse) { .pad-key { display: none; } }
.pad-new {
  position: absolute; right: 6cqmin; top: 5cqmin; display: none; z-index: 1;
  font-family: var(--font-num); font-weight: 900; font-size: clamp(11px, 7cqmin, 20px);
  padding: .2em .6em; border-radius: 999px; background: var(--text); color: var(--bg);
}
/* 가운데 허브와 겹치지 않도록 라벨·박자 스트립은 패드의 바깥쪽 가장자리에 둔다 */
.pad[data-pad="9"] .pad-key, .pad[data-pad="3"] .pad-key { left: auto; right: 6cqmin; }
.pad[data-pad="9"] .pad-new, .pad[data-pad="3"] .pad-new { right: auto; left: 6cqmin; }
.pad[data-pad="1"] .pad-key, .pad[data-pad="3"] .pad-key,
.pad[data-pad="1"] .pad-new, .pad[data-pad="3"] .pad-new { top: auto; bottom: 5cqmin; }
.pad.is-new .pad-new { display: block; animation: popIn .45s var(--ease-out-back); }
.pad.is-new .pad-glow { animation: newGlow 1.4s ease-out; }
@keyframes newGlow { 0%, 40% { opacity: 1; } 100% { opacity: 0; } }
@keyframes popIn { from { transform: scale(.4); opacity: 0; } to { transform: none; opacity: 1; } }

/* 박자 스트립: 이 패드가 이번 마디 몇 박에 쳐야 하는지 */
.pad-beats { position: absolute; left: 0; right: 0; top: 17cqmin; display: flex; flex-direction: column; align-items: center; gap: 2.2cqmin; }
.pad[data-pad="1"] .pad-beats, .pad[data-pad="3"] .pad-beats { top: auto; bottom: 17cqmin; flex-direction: column-reverse; }
@media (hover: none) and (pointer: coarse) {
  .pad-beats { top: 8cqmin; }
  .pad[data-pad="1"] .pad-beats, .pad[data-pad="3"] .pad-beats { top: auto; bottom: 8cqmin; }
}
.pad-dots { display: flex; align-items: center; gap: 2.4cqmin; }
.dot {
  width: 7.5cqmin; height: 7.5cqmin; min-width: 7px; min-height: 7px; max-width: 22px; max-height: 22px;
  border-radius: 50%; border: max(1.5px, .7cqmin) solid currentColor; opacity: .35;
  display: grid; place-items: center; font-size: 5cqmin; font-weight: 900; line-height: 1;
  transition: transform .15s var(--ease-out-back), background .15s;
}
.dot.half { width: 5cqmin; height: 5cqmin; min-width: 5px; min-height: 5px; }
.dot.on { background: currentColor; opacity: .85; }
.dot.now { transform: scale(1.3); }
.dot.j-perfect { background: var(--perfect); border-color: var(--perfect); opacity: 1; }
.dot.j-great { background: var(--great); border-color: var(--great); opacity: 1; }
.dot.j-good { background: var(--good); border-color: var(--good); opacity: 1; }
.dot.j-miss { background: transparent; border-color: var(--miss); opacity: .9; }
.dot.j-miss::after { content: '×'; color: var(--pad-ink); font-size: 6cqmin; }
.pad-next { display: none; align-items: center; gap: 2cqmin; opacity: .45; }
.pad.show-next .pad-next { display: flex; }
.next-label { font-family: var(--font-num); font-weight: 900; font-size: clamp(9px, 5cqmin, 15px); letter-spacing: .06em; }

.pad-flash { position: absolute; inset: 0; opacity: 0; pointer-events: none; background: var(--flash, #fff); }
.pad-flash.go { animation: flash .28s ease-out; }
@keyframes flash { 0% { opacity: .6; } 100% { opacity: 0; } }
.pad-face.shake { animation: shake .16s linear; }
@keyframes shake { 0%, 100% { translate: 0 0; } 25% { translate: -4px 0; } 75% { translate: 4px 0; } }

.judge-pop {
  position: absolute; left: 50%; top: calc(50% - 26cqmin); z-index: 3; pointer-events: none;
  font-family: var(--font-num); font-weight: 900; letter-spacing: .02em; white-space: nowrap;
  font-size: clamp(16px, 11cqmin, 44px);
  -webkit-text-stroke: max(3px, .9cqmin) var(--surface); paint-order: stroke fill;
  animation: judgePop .42s ease-out forwards;
}
.judge-pop.perfect { color: var(--perfect); }
.judge-pop.great { color: var(--great); }
.judge-pop.good { color: var(--good); }
.judge-pop.miss { color: var(--miss); }
.judge-pop.wrong { color: var(--danger); font-size: clamp(14px, 8cqmin, 32px); }
@keyframes judgePop {
  0% { opacity: 0; transform: translate(-50%, 8px) scale(.7); }
  18% { opacity: 1; transform: translate(-50%, 0) scale(1.08); }
  100% { opacity: 0; transform: translate(-50%, -20px) scale(1); }
}

/* 중앙 허브: 박자 링 + 라운드 + 점수. 탭하면 일시정지 */
.hub {
  position: absolute; left: 50%; top: 50%; z-index: 5;
  width: clamp(86px, 17vmin, 136px); aspect-ratio: 1; transform: translate(-50%, -50%);
  border-radius: 50%; border: 0; padding: 0;
  background: var(--glass); -webkit-backdrop-filter: blur(16px) saturate(1.4); backdrop-filter: blur(16px) saturate(1.4);
  box-shadow: 0 0 0 clamp(4px, 1vmin, 7px) var(--bg), var(--shadow-2);
  display: grid; place-items: center; color: var(--text);
  touch-action: none;
}
.hub svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.hub .seg { fill: none; stroke: var(--line); stroke-width: 7; stroke-linecap: round; transition: stroke .08s; }
:root[data-theme="dark"] .hub .seg { stroke: rgba(243,240,255,.14); }
.hub .seg.on { stroke: var(--text); }
.hub .seg.strong.on { stroke: var(--accent); }
.hub .prog { fill: none; stroke: var(--accent); stroke-width: 2.5; stroke-linecap: round; opacity: .55; }
.hub .prog-bg { fill: none; stroke: var(--line); stroke-width: 2.5; }
.hub .head { fill: var(--text); }
.hub-inner { position: relative; display: flex; flex-direction: column; align-items: center; line-height: 1.05; pointer-events: none; }
.hub-round { font-family: var(--font-num); font-weight: 800; font-size: clamp(10px, 2.1vmin, 13px); color: var(--text-sub); letter-spacing: .04em; }
.hub-score { font-weight: 850; font-size: clamp(15px, 3.4vmin, 24px); display: inline-block; transition: transform .12s; }
.hub-score.bump { transform: scale(1.15); }
.hub-count { font-family: var(--font-num); font-weight: 900; font-size: clamp(32px, 8vmin, 60px); line-height: 1; }
.hub-count.tick { animation: countPop .3s var(--ease-out-back); }
@keyframes countPop { from { transform: scale(1.5); opacity: .3; } to { transform: none; opacity: 1; } }
.hub .pause-glyph { position: absolute; bottom: 14%; font-size: clamp(8px, 1.6vmin, 11px); color: var(--text-sub); opacity: .7; }

.float-layer { position: absolute; left: 50%; top: 50%; width: 0; height: 0; z-index: 6; pointer-events: none; }
.combo-chip {
  position: absolute; left: 0; bottom: calc(clamp(86px, 17vmin, 136px) / 2 + 12px); transform: translateX(-50%);
  white-space: nowrap; padding: 5px 12px; border-radius: 999px;
  background: var(--perfect); color: #2B2100; font-family: var(--font-num); font-weight: 900; font-size: clamp(12px, 2.4vmin, 16px);
  box-shadow: 0 4px 14px rgba(245,183,0,.4);
}
.combo-chip.bump { animation: popIn .25s var(--ease-out-back); }
.score-pop {
  position: absolute; left: 0; top: calc(clamp(86px, 17vmin, 136px) / 2 + 8px);
  white-space: nowrap; font-family: var(--font-num); font-weight: 900; font-size: clamp(13px, 2.6vmin, 18px);
  color: var(--perfect); -webkit-text-stroke: 3px var(--bg); paint-order: stroke fill;
  animation: scorePop .9s ease-out forwards;
}
.score-pop.minus { color: var(--danger); }
@keyframes scorePop { 0% { opacity: 0; transform: translate(-50%, 6px); } 15% { opacity: 1; transform: translate(-50%, 0); } 100% { opacity: 0; transform: translate(-50%, 26px); } }
.banner {
  position: absolute; left: 0; white-space: nowrap; transform: translateX(-50%);
  padding: 10px 20px; border-radius: 999px; font-family: var(--font-num); font-weight: 900;
  font-size: clamp(16px, 4vmin, 28px); letter-spacing: .02em;
  background: var(--surface); color: var(--text); box-shadow: var(--shadow-2);
  animation: bannerIn .6s ease-out forwards;
}
.banner.round { bottom: calc(clamp(86px, 17vmin, 136px) / 2 + 52px); }
.banner.callout { top: calc(clamp(86px, 17vmin, 136px) / 2 + 40px); font-size: clamp(14px, 3.2vmin, 22px); padding: 8px 16px; }
.banner.big { font-size: clamp(26px, 7vmin, 52px); padding: 14px 28px; bottom: auto; top: 0; transform: translate(-50%, -50%); animation-duration: 1.4s; }
.banner.perfect { background: linear-gradient(135deg, #FFE27A, #F5B700); color: #2B2100; }
.banner.great { background: var(--great); color: #06210F; }
.banner.good { background: var(--good); color: #fff; }
.banner.break { background: var(--miss); color: #fff; }
@keyframes bannerIn {
  0% { opacity: 0; scale: .6; } 15% { opacity: 1; scale: 1.06; } 25% { scale: 1; } 80% { opacity: 1; } 100% { opacity: 0; scale: .96; }
}
.sparkles { position: absolute; left: 0; top: 0; }
.sparkles i {
  position: absolute; width: 8px; height: 8px; border-radius: 2px; left: -4px; top: -4px;
  animation: spark 1s ease-out forwards;
}
@keyframes spark { from { transform: translate(0,0) rotate(0); opacity: 1; } to { transform: translate(var(--x), var(--y)) rotate(260deg); opacity: 0; } }

/* 일시정지 오버레이 */
.overlay {
  position: absolute; inset: 0; z-index: 20;
  display: grid; place-items: center; padding: 20px;
  background: color-mix(in srgb, var(--bg) 55%, transparent);
  -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
  animation: fadeIn .2s ease-out;
}
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.sheet {
  width: min(380px, 100%); padding: 24px 20px; border-radius: 28px;
  background: var(--surface); box-shadow: var(--shadow-2); border: 1px solid var(--line);
  display: flex; flex-direction: column; gap: 10px; text-align: center;
}
.sheet h2 { margin: 0 0 6px; font-size: 24px; font-weight: 850; }
.sheet .btn { width: 100%; }
.sheet .sheet-row { display: flex; gap: 8px; justify-content: center; margin-top: 6px; }

/* =========================================================================
   결과 화면
   ========================================================================= */
#screen-result { overflow-y: auto; touch-action: pan-y; -webkit-overflow-scrolling: touch; }
.result-wrap {
  width: 100%; max-width: 1040px; margin: 0 auto; padding: 16px 16px 28px;
  display: grid; gap: 14px; grid-template-columns: 1fr;
}
@media (min-width: 860px) {
  .result-wrap { grid-template-columns: 1.05fr .95fr; align-items: start; padding-top: 28px; }
  .result-head { grid-column: 1 / -1; }
  .col-right { position: sticky; top: 16px; }
}
.result-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.result-head h2 { margin: 0; font-family: var(--font-num); font-weight: 900; font-size: 22px; letter-spacing: .08em; }
.chip {
  display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 999px;
  background: var(--surface); border: 1px solid var(--line); font-size: 13px; font-weight: 700; color: var(--text-sub);
}
.card {
  background: var(--glass); border: 1px solid var(--glass-border); border-radius: var(--radius-card);
  -webkit-backdrop-filter: blur(18px); backdrop-filter: blur(18px);
  box-shadow: var(--shadow-1); padding: 16px;
}
.col { display: grid; gap: 14px; min-width: 0; }
.score-rows { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.score-row {
  display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 2px 12px;
  padding: 10px 4px; border-bottom: 1px dashed var(--line);
  opacity: 0; transform: translateX(-18px);
  transition: opacity .3s ease-out, transform .35s var(--ease-out-back);
}
.score-row:last-child { border-bottom: 0; }
.score-row.in { opacity: 1; transform: none; }
.score-row .lbl { font-weight: 750; font-size: 15px; }
.score-row .val { font-weight: 850; font-size: 20px; text-align: right; }
.score-row .sub { grid-column: 1 / -1; font-size: 12.5px; color: var(--text-sub); font-weight: 600; }
.score-row.special .val { color: var(--perfect); }
.score-row.special.in .lbl { background: linear-gradient(90deg, var(--perfect), #FF9EB5, var(--perfect)); background-size: 200% 100%; -webkit-background-clip: text; background-clip: text; color: transparent; animation: shimmer 1.6s linear infinite; }
@keyframes shimmer { to { background-position: -200% 0; } }
.score-row.penalty .val { color: var(--danger); }
.score-row.mult .val { color: var(--accent); }
.round-badges { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px; }
.rb {
  width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center;
  font-family: var(--font-num); font-weight: 900; font-size: 11px; color: #fff;
  opacity: 0; transform: scale(1.8);
}
.rb.stamp { opacity: 1; transform: none; transition: transform .16s cubic-bezier(.2,1.6,.4,1), opacity .08s; }
.rb.PERFECT { background: var(--perfect); color: #2B2100; }
.rb.GREAT { background: var(--great); color: #06210F; }
.rb.GOOD { background: var(--good); }
.rb.BREAK { background: var(--miss); }

.total-card { text-align: center; padding: 20px 16px 18px; position: relative; overflow: hidden; }
.total-label { font-family: var(--font-num); font-weight: 900; letter-spacing: .14em; font-size: 13px; color: var(--text-sub); }
.total-num { font-size: clamp(52px, 15vw, 88px); font-weight: 900; line-height: 1.05; margin: 4px 0; letter-spacing: -.04em; }
.new-record {
  display: inline-block; padding: 4px 12px; border-radius: 999px; background: var(--text); color: var(--bg);
  font-weight: 850; font-size: 13px; animation: fadeIn .3s ease-out;
}
.meter { height: 10px; border-radius: 999px; background: var(--line); overflow: hidden; margin: 12px 0 6px; }
.meter i { display: block; height: 100%; width: 0; border-radius: inherit; background: linear-gradient(90deg, var(--pad-7), var(--pad-9), var(--pad-1), var(--pad-3)); transition: width 1s ease-out; }
.achieve { font-size: 13px; color: var(--text-sub); font-weight: 700; }
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.stat { padding: 12px 14px; }
.stat .k { font-size: 12.5px; color: var(--text-sub); font-weight: 700; }
.stat .v { font-size: 20px; font-weight: 850; margin-top: 2px; }
.stat.wide { grid-column: 1 / -1; }
.dist-bar { display: flex; height: 12px; border-radius: 999px; overflow: hidden; background: var(--line); margin: 8px 0; }
.dist-bar i { display: block; height: 100%; }
.dist-legend { display: flex; flex-wrap: wrap; gap: 6px 12px; font-size: 12.5px; font-weight: 700; }
.dist-legend span::before { content: ''; display: inline-block; width: 9px; height: 9px; border-radius: 3px; margin-right: 5px; background: var(--c); vertical-align: 0; }
.fade-block { opacity: 0; transform: translateY(8px); transition: opacity .4s ease-out, transform .4s ease-out; }
.fade-block.in { opacity: 1; transform: none; }
.fade-block:not(.in) { pointer-events: none; }
.share-thumb { display: block; width: 100%; max-width: 360px; margin: 0 auto; aspect-ratio: 4 / 5; border-radius: 16px; box-shadow: var(--shadow-2); background: var(--surface-2); object-fit: cover; }
.result-buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.result-buttons .btn { min-width: 0; width: 100%; font-size: 14.5px; padding: 10px 14px; }
.result-buttons .btn-primary { grid-column: 1 / -1; min-height: 56px; font-size: 17px; }
.skip-hint { text-align: center; font-size: 12.5px; color: var(--text-sub); font-weight: 600; animation: blink 1.4s ease-in-out infinite; }
@keyframes blink { 50% { opacity: .35; } }

/* =========================================================================
   모달 (모바일: 바텀시트 / 넓은 화면: 다이얼로그)
   ========================================================================= */
.modal {
  position: fixed; inset: 0; z-index: 50; display: flex; align-items: flex-end; justify-content: center;
  background: rgba(20, 16, 36, .38); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
  animation: fadeIn .2s ease-out;
}
.modal-panel {
  width: min(560px, 100%); max-height: min(92dvh, 860px); overflow-y: auto; touch-action: pan-y;
  background: var(--surface); border-radius: 28px 28px 0 0; box-shadow: var(--shadow-2);
  padding: 10px 20px calc(20px + var(--safe-b));
  animation: sheetUp .32s cubic-bezier(.2, .9, .3, 1.05);
  position: relative; overscroll-behavior: contain;
}
.modal-panel::before { content: ''; display: block; width: 40px; height: 5px; border-radius: 99px; background: var(--line); margin: 0 auto 10px; }
@media (min-width: 640px) and (min-height: 560px) {
  .modal { align-items: center; padding: 24px; }
  .modal-panel { border-radius: 28px; padding-bottom: 22px; animation: dialogIn .25s var(--ease-out-back); }
  .modal-panel::before { display: none; }
}
@keyframes sheetUp { from { transform: translateY(100%); } to { transform: none; } }
@keyframes dialogIn { from { transform: scale(.94); opacity: 0; } to { transform: none; opacity: 1; } }
.modal-head { display: flex; align-items: center; justify-content: space-between; margin: 4px 0 12px; }
.modal-head h2 { margin: 0; font-size: 22px; font-weight: 850; }
.set-group { margin: 14px 0 6px; font-size: 12.5px; font-weight: 800; color: var(--text-sub); letter-spacing: .04em; }
.set-list { background: var(--surface-2); border-radius: 18px; padding: 4px 14px; }
.set-item { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 54px; padding: 8px 0; border-bottom: 1px solid var(--line); }
.set-item:last-child { border-bottom: 0; }
.set-item.col { flex-direction: column; align-items: stretch; gap: 8px; }
.set-item .lab { font-weight: 700; font-size: 15px; }
.set-item .hint { font-size: 12px; color: var(--text-sub); font-weight: 500; margin-top: 2px; }
.set-item output { font-family: var(--font-num); font-weight: 800; font-variant-numeric: tabular-nums; min-width: 64px; text-align: right; }
.range-row { display: flex; align-items: center; gap: 12px; }
input[type="range"] { flex: 1; accent-color: var(--accent); height: 32px; touch-action: pan-x; }
.switch { position: relative; width: 52px; height: 32px; flex: none; }
.switch input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; }
.switch span { position: absolute; inset: 0; border-radius: 99px; background: var(--line); transition: background .2s; pointer-events: none; }
.switch span::after { content: ''; position: absolute; left: 3px; top: 3px; width: 26px; height: 26px; border-radius: 50%; background: #fff; box-shadow: 0 2px 6px rgba(0,0,0,.2); transition: transform .22s var(--ease-out-back); }
.switch input:checked + span { background: var(--accent); }
.switch input:checked + span::after { transform: translateX(20px); }
.switch input:focus-visible + span { outline: 3px solid var(--accent); outline-offset: 2px; }
.seg-ctl { display: flex; background: var(--line); padding: 3px; border-radius: 12px; gap: 2px; }
.seg-ctl button { flex: 1; min-height: 36px; border: 0; border-radius: 9px; background: transparent; font-weight: 700; font-size: 13.5px; padding: 4px 8px; }
.seg-ctl button[aria-pressed="true"] { background: var(--surface); box-shadow: var(--shadow-1); }
.set-item select { min-height: 38px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); padding: 4px 10px; font-weight: 700; }
.how-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.how-list li { display: flex; gap: 14px; align-items: center; padding: 14px; border-radius: 18px; background: var(--surface-2); font-weight: 700; font-size: 15.5px; line-height: 1.4; }
.how-list .ic { flex: none; width: 52px; height: 52px; border-radius: 16px; display: grid; place-items: center; font-size: 24px; }
.mini-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 3px; width: 40px; height: 40px; }
.mini-grid b { border-radius: 5px; display: grid; place-items: center; font-family: var(--font-num); font-size: 11px; color: var(--pad-ink); }
.modal-foot { margin-top: 16px; display: flex; gap: 10px; }
.modal-foot .btn { flex: 1; }

/* 타이밍 보정 */
.calib { display: grid; gap: 14px; text-align: center; }
.calib-pad {
  height: min(42vh, 280px); border-radius: 28px; border: 0; width: 100%;
  background: radial-gradient(120% 90% at 30% 0%, rgba(255,255,255,.5), transparent 55%), var(--pad-9);
  color: var(--pad-ink); font-size: 20px; font-weight: 850; touch-action: none;
  display: grid; place-items: center; box-shadow: inset 0 -6px 0 rgba(0,0,0,.08);
  transition: transform .06s;
}
.calib-pad:active { transform: scale(.97); }
.calib-dots { display: flex; justify-content: center; gap: 8px; }
.calib-dots i { width: 14px; height: 14px; border-radius: 50%; background: var(--line); transition: background .1s, transform .1s; }
.calib-dots i.beat { background: var(--text-sub); transform: scale(1.2); }
.calib-dots i.lead { opacity: .5; }
.calib-dots i.hit { background: var(--great); }
.calib-status { font-weight: 800; min-height: 1.4em; }

.toast {
  position: fixed; left: 50%; bottom: calc(24px + var(--safe-b)); z-index: 80;
  transform: translate(-50%, 20px); opacity: 0; pointer-events: none;
  padding: 12px 20px; border-radius: 999px; background: var(--text); color: var(--bg);
  font-weight: 750; font-size: 14.5px; box-shadow: var(--shadow-2);
  transition: opacity .25s, transform .3s var(--ease-out-back); max-width: calc(100vw - 32px); text-align: center;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; }
  .bg-blobs i { animation: none; }
  .judge-pop { animation: judgePopRM .45s steps(1) forwards !important; animation-duration: .45s !important; }
  @keyframes judgePopRM { 0% { opacity: 1; transform: translate(-50%, 0); } 100% { opacity: 0; } }
}
</style>

<body>
<div class="bg-blobs" aria-hidden="true"><i></i><i></i><i></i><i></i></div>

<div id="app">
  <!-- ================= 시작 화면 ================= -->
  <section id="screen-title" class="screen active" aria-labelledby="title-h1">
    <header class="topbar">
      <label class="pill-select"><span aria-hidden="true">🌐</span>
        <select class="lang-select" data-i18n-aria="language"></select>
      </label>
      <button class="icon-btn theme-toggle" type="button" data-i18n-aria="theme">☀️</button>
    </header>
    <div class="title-main">
      <div class="logo-mark" aria-hidden="true"><span>♩</span><span>♪</span><span>♪</span><span>♩</span></div>
      <div class="title-text">
        <h1 id="title-h1" data-i18n="title">리듬 마스터 챌린지</h1>
        <p data-i18n="tagline"></p>
      </div>
      <div class="best-card" id="title-best" hidden><span>🏆</span><span data-i18n="bestScore"></span><b class="num" id="title-best-n"></b></div>

        <div style="font-size:28px" aria-hidden="true">🥁</div>

        <button class="btn" type="button" id="btn-clear-challenge" data-i18n="clearChallenge"></button>

        <button class="btn btn-primary btn-big" type="button" id="btn-start"><span data-i18n="start"></span></button>

          <button class="btn" type="button" id="btn-howto">📖 <span data-i18n="howTo"></span></button>

  <!-- ================= 플레이 화면 ================= -->
  <section id="screen-game" class="screen" aria-label="game">
    <div class="stage">
      <div class="pads" id="pads"></div>
      <button class="hub" type="button" id="hub" data-i18n-aria="pause">
        <svg viewBox="0 0 100 100" aria-hidden="true" id="hub-svg"></svg>
        <div class="hub-inner">
          <span class="hub-round" id="hub-round">1/8</span>

          <label class="pill-select"><span aria-hidden="true">🌐</span><select class="lang-select" data-i18n-aria="language"></select></label>
          <button class="icon-btn theme-toggle" type="button" data-i18n-aria="theme">☀️</button>
        </div>

  </section>

  <!-- ================= 결과 화면 ================= -->
  <section id="screen-result" class="screen" aria-labelledby="result-h">
    <div class="result-wrap">

      <div class="col">
        <div class="card">
          <ul class="score-rows" id="score-rows"></ul>
        </div>
        <div class="card total-card">
          <div class="total-label" data-i18n="totalScore"></div>
          <div class="total-num num" id="total-num">0</div>
          <div class="new-record" id="new-record" hidden data-i18n="newRecord"></div>
          <div class="fade-block" id="achieve-block">
            <div class="meter"><i id="achieve-meter"></i></div>
            <div class="achieve num" id="achieve-text"></div>
          </div>
        </div>
        <div class="skip-hint" id="skip-hint" data-i18n="tapToSkip"></div>
      </div>
      <div class="col col-right fade-block" id="result-extra">
        <div class="stats">
          <div class="card stat"><div class="k" data-i18n="accuracy"></div><div class="v num" id="st-acc"></div></div>
          <div class="card stat"><div class="k" data-i18n="maxCombo"></div><div class="v num" id="st-combo"></div></div>
          <div class="card stat wide"><div class="k" data-i18n="timing"></div><div class="v" id="st-tendency"></div></div>
          <div class="card stat wide">
            <div class="k" data-i18n="distribution"></div>
            <div class="dist-bar" id="dist-bar"></div>

<script>
'use strict';
/* =========================================================================
   1. CONFIG
   ========================================================================= */
const CONFIG = {
  TOTAL_ROUNDS: 8,
  BEATS_PER_ROUND: 4,
  COUNT_IN_BEATS: 4,
  GAP_BARS_BETWEEN_ROUNDS: 0,
  DEFAULT_BPM: 90,
  LEVEL_DEFAULT_BPM: { easy: 75, normal: 90, hard: 90 },
  BPM_MIN: 60, BPM_MAX: 140,
  OFFSET_MAX_MS: 300,
  PAD_IDS: [7, 9, 1, 3],
  ACTIVE_PADS_BY_ROUND: [[7, 9], [7, 9], [7, 9, 1], [7, 9, 1], [7, 9, 1, 3], [7, 9, 1, 3], [7, 9, 1, 3], [7, 9, 1, 3]],
  RANDOMIZE_ACTIVE_PADS: false,
  WINDOWS_MS: { perfect: 45, great: 90, good: 140 },
  START_DELAY_S: 0.1,
  SCHED_INTERVAL_MS: 25,
  SCHED_LOOKAHEAD_S: 0.1,
  CHATTER_MS: 30,
  PULSE_S: 0.15,
  COMBO_CALLOUTS: [5, 10, 20],
  SCORING: {
    hit: { perfect: 1000, great: 500, good: 200, miss: 0 },
    wrongHit: -300,
    roundBonus: { 0: 2000, 1: 1000, 2: 400, else: 0 },
    roundWeight: [1, 1, 1.5, 1.5, 2, 2, 2, 2],
    perfectCombo: [
      { min: 2, max: 4, step: 100 },          // 100 × (n − 1)
      { min: 5, max: 9, perHit: 500 },
      { min: 10, max: 19, perHit: 800 },
      { min: 20, max: Infinity, perHit: 1000 },
    ],
    milestone: { 10: 2000, 20: 5000 },
    fullPerfect: 20000, noMiss: 3000,
    levelMul: { easy: 0.8, normal: 1.0, hard: 1.3 },
    bpmMul: { base: 90, min: 0.7, max: 1.5 },
  },
};
const LEVELS = ['easy', 'normal', 'hard'];
const W = { perfect: CONFIG.WINDOWS_MS.perfect / 1000, great: CONFIG.WINDOWS_MS.great / 1000, good: CONFIG.WINDOWS_MS.good / 1000 };
const reducedMotion = () => window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const $ = (s, root = document) => root.querySelector(s);
const $$ = (s, root = document) => Array.from(root.querySelectorAll(s));

/* =========================================================================
   2. rng — 시드 기반 난수 (mulberry32)
   ========================================================================= */
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function makeRng(seed) {
  const r = mulberry32(seed >>> 0);
  return {
    next: r,
    int: n => Math.floor(r() * n),
    pick: arr => arr[Math.floor(r() * arr.length)],
    chance: p => r() < p,
    shuffle(arr) { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; },
  };
}
function randomSeed() {
  try { const u = new Uint32Array(1); crypto.getRandomValues(u); return 10000000 + (u[0] % 90000000); }
  catch (e) { return 10000000 + Math.floor(Math.random() * 90000000); }
}

/* =========================================================================
   3. PatternGenerator — 라운드별 패턴 생성
   ========================================================================= */
const PatternGenerator = {
  generate(seed, level) {
    const rng = makeRng(seed);
    const sets = this.activeSets(rng);
    const rounds = [];
    let prevKey = null;
    for (let r = 0; r < CONFIG.TOTAL_ROUNDS; r++) {
      const pads = sets[r];
      const newPads = r > 0 ? pads.filter(p => !sets[r - 1].includes(p)) : [];
      const eighths = level === 'hard' && r >= 4;
      let notes = null, key = null;
      for (let attempt = 0; attempt < 800 && !notes; attempt++) {
        const cand = this.tryRound(rng, r, pads, level);
        if (!cand) continue;
        const k = this.keyOf(cand);
        if (k === prevKey) continue;
        notes = cand; key = k;
      }
      if (!notes) { notes = this.fallback(r, pads, prevKey); key = this.keyOf(notes); }
      prevKey = key;
      rounds.push({ index: r, pads, newPads, subdiv: eighths ? 8 : 4, notes });
    }
    return rounds;
  },
  activeSets(rng) {
    const base = CONFIG.ACTIVE_PADS_BY_ROUND;
    if (!CONFIG.RANDOMIZE_ACTIVE_PADS) return base.map(s => s.slice());
    const order = rng.shuffle(CONFIG.PAD_IDS);
    return base.map(s => order.slice(0, s.length));
  },
  keyOf(notes) { return notes.map(n => n.beatPos + ':' + n.padId).join(','); },
  hasTriple(notes) {
    const seq = notes.filter(n => !n.chord).sort((a, b) => a.beatPos - b.beatPos).map(n => n.padId);
    for (let i = 2; i < seq.length; i++) if (seq[i] === seq[i - 1] && seq[i] === seq[i - 2]) return true;
    return false;
  },
  tryRound(rng, r, pads, level) {
    const allowRest = level !== 'easy';
    const seq = [];
    let rests = 0;
    for (let s = 0; s < 4; s++) {
      if (allowRest && s > 0 && rests < 1 && rng.chance(0.22)) { seq.push(null); rests++; continue; }
      seq.push(rng.pick(pads));
    }
    if (!pads.every(p => seq.includes(p))) return null;       // 활성 패드 모두 1회 이상
    const notes = [];
    seq.forEach((p, i) => { if (p != null) notes.push({ beatPos: i, padId: p, eighth: false, chord: false }); });
    if (level === 'hard' && r >= 4) {
      // 8분음표 쌍: R5~6 최대 1쌍, R7~8 최대 2쌍
      const maxPairs = r >= 6 ? 2 : 1;
      const pairs = r >= 6 ? 1 + rng.int(maxPairs) : 1;
      const cands = rng.shuffle(notes.map(n => n.beatPos));
      for (let k = 0; k < pairs && k < cands.length; k++) {
        const b = cands[k];
        const first = notes.find(n => n.beatPos === b);
        first.eighth = true;
        notes.push({ beatPos: b + 0.5, padId: rng.pick(pads), eighth: true, chord: false });
      }
      if (r === 7) {
        // R8만 동시타 1회
        const quarter = notes.filter(n => Number.isInteger(n.beatPos));
        const host = rng.pick(quarter);
        const others = pads.filter(p => p !== host.padId);
        host.chord = false;
        notes.push({ beatPos: host.beatPos, padId: rng.pick(others), eighth: host.eighth, chord: true });
      }
    }
    if (this.hasTriple(notes)) return null;
    notes.sort((a, b) => a.beatPos - b.beatPos || CONFIG.PAD_IDS.indexOf(a.padId) - CONFIG.PAD_IDS.indexOf(b.padId));
    return notes;
  },
  fallback(r, pads, prevKey) {
    for (let shift = 0; shift < pads.length; shift++) {
      const notes = [0, 1, 2, 3].map(i => ({ beatPos: i, padId: pads[(i + shift) % pads.length], eighth: false, chord: false }));
      if (this.keyOf(notes) !== prevKey) return notes;
    }
    return [0, 1, 2, 3].map(i => ({ beatPos: i, padId: pads[i % pads.length], eighth: false, chord: false }));
  },
};

/* =========================================================================
   4. AudioEngine — 둥 소리·틱·효과음 (Web Audio 합성, 외부 파일 없음)
   ========================================================================= */
const DRUM_VOICES = { 7: [520, 260, 0.18], 9: [400, 200, 0.20], 1: [300, 150, 0.23], 3: [220, 110, 0.26] };
const AudioEngine = {
  supported: !!(window.AudioContext || window.webkitAudioContext),
  ctx: null, master: null, comp: null, noise: null,
  useCtx: false,          // 게임 시계로 오디오 시계를 쓸지 (재생 가능할 때만)
  volume: 0.8,
  async ensure() {
    if (!this.supported) { this.useCtx = false; return false; }
    try {
      if (!this.ctx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        this.ctx = new AC({ latencyHint: 'interactive' });
        const ctx = this.ctx;
        this.comp = ctx.createDynamicsCompressor();
        this.comp.threshold.value = -14; this.comp.knee.value = 12; this.comp.ratio.value = 6;
        this.comp.attack.value = 0.002; this.comp.release.value = 0.12;
        this.master = ctx.createGain();
        this.master.gain.value = this.volume;
        this.comp.connect(this.master); this.master.connect(ctx.destination);
        // 노이즈 버퍼는 최초 1회만 생성해 재사용
        const len = Math.floor(ctx.sampleRate * 0.03);
        this.noise = ctx.createBuffer(1, len, ctx.sampleRate);
        const d = this.noise.getChannelData(0);
        for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
        // iOS 잠금 해제용 무음 버퍼
        const silent = ctx.createBufferSource();
        silent.buffer = ctx.createBuffer(1, 1, ctx.sampleRate);
        silent.connect(ctx.destination); silent.start(0);
        ctx.onstatechange = () => { if (ctx.state !== 'running') App.onAudioInterrupted(); };
      }
      if (this.ctx.state !== 'running') {
        await Promise.race([this.ctx.resume(), new Promise(r => setTimeout(r, 600))]);
      }
    } catch (e) {
      console.warn('AudioContext unavailable', e);
    }
    this.useCtx = !!(this.ctx && this.ctx.state === 'running');
    return this.useCtx;
  },
  setVolume(v) {
    this.volume = v;
    if (this.master) this.master.gain.setTargetAtTime(v, this.ctx.currentTime, 0.015);
  },
  /** 스케줄링 기준 시계 (초) */
  now() { return this.useCtx ? this.ctx.currentTime : performance.now() / 1000; },
  /** perfMs(performance.now 기준) 시점에 "귀에 들리고 있던" 오디오 시각 */
  audible(perfMs) {
    const pnow = performance.now();
    if (perfMs == null) perfMs = pnow;
    if (!this.useCtx) return perfMs / 1000;
    const ctx = this.ctx;
    const ref = ctx.currentTime - (pnow - perfMs) / 1000;
    if (ctx.getOutputTimestamp) {
      const ts = ctx.getOutputTimestamp();
      if (ts && ts.contextTime > 0 && ts.performanceTime > 0) {
        const est = ts.contextTime + (perfMs - ts.performanceTime) / 1000;
        if (est <= ref + 0.02 && est >= ref - 0.5) return est;
      }
    }
    const lat = (ctx.outputLatency > 0 ? ctx.outputLatency : 0) || ctx.baseLatency || 0;
    return ref - lat;
  },
  _env(g, t, peak, dur) {
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(peak, t + 0.002);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  },
  _tone(type, f0, f1, t, dur, peak, glide) {
    const ctx = this.ctx;
    const o = ctx.createOscillator(); const g = ctx.createGain();
    o.type = type;
    o.frequency.setValueAtTime(f0, t);
    if (f1 && f1 !== f0) o.frequency.exponentialRampToValueAtTime(f1, t + (glide || dur));
    this._env(g, t, peak, dur);
    o.connect(g); g.connect(this.comp);
    o.start(t); o.stop(t + dur + 0.03);
  },
  drum(padId, sparkle) {
    if (!this.useCtx) return;
    const [f0, f1, dur] = DRUM_VOICES[padId];
    const t = this.ctx.currentTime;
    this._tone('sine', f0, f1, t, dur, 0.9, 0.12);                   // 말랑한 몸통
    this._tone('triangle', f0 * 2, f1 * 2, t, dur * 0.6, 0.09, 0.12); // "뿅" 배음
    const n = this.ctx.createBufferSource(); n.buffer = this.noise;    // "톡" 클릭
    const bp = this.ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 2000; bp.Q.value = 1.2;
    const ng = this.ctx.createGain(); this._env(ng, t, 0.25, 0.009);
    n.connect(bp); bp.connect(ng); ng.connect(this.comp); n.start(t); n.stop(t + 0.02);
    if (sparkle) this._tone('sine', 1500, 1500, t + 0.005, 0.04, 0.08);
  },
  tick(t, accent, countIn) {
    if (!this.useCtx) return;
    const f = accent ? 1500 : 1000;
    const peak = (accent ? 0.32 : 0.16) * (countIn ? 1.15 : 1);
    this._tone('sine', f, f, t, accent ? 0.03 : 0.025, peak);
  },
  pop(t) { if (this.useCtx) this._tone('sine', 600, 900, t ?? this.ctx.currentTime, 0.08, 0.12, 0.08); },
  countTick(progress) {
    if (!this.useCtx) return;
    const f = 1800 + 800 * clamp(progress, 0, 1);
    this._tone('sine', f, f, this.ctx.currentTime, 0.015, 0.05);
  },
  arpeggio(t) {
    if (!this.useCtx) return;
    t = t ?? this.ctx.currentTime;
    [1047, 1319, 1568].forEach((f, i) => this._tone('triangle', f, f, t + i * 0.06, 0.09, 0.12));
  },
  buu(t) {
    if (!this.useCtx) return;
    t = t ?? this.ctx.currentTime;
    const o = this.ctx.createOscillator(); const g = this.ctx.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(300, t); o.frequency.linearRampToValueAtTime(360, t + 0.07);
    o.frequency.exponentialRampToValueAtTime(190, t + 0.28);
    this._env(g, t, 0.2, 0.3); o.connect(g); g.connect(this.comp); o.start(t); o.stop(t + 0.33);
  },
  milestone() {
    if (!this.useCtx) return;
    const t = this.ctx.currentTime;
    [880, 1319].forEach((f, i) => this._tone('triangle', f, f, t + i * 0.07, 0.1, 0.1));
  },
  fanfare() {
    if (!this.useCtx) return;
    const t = this.ctx.currentTime;
    [784, 988, 1175, 1568].forEach((f, i) => this._tone('triangle', f, f, t + i * 0.08, 0.16, 0.12));
  },
  tap() { if (this.useCtx) this._tone('sine', 900, 700, this.ctx.currentTime, 0.03, 0.06); },
};

/* =========================================================================
   9. Storage — 설정 / 최고 기록 (localStorage 실패해도 기본값으로 동작)
   ========================================================================= */
const Storage = {
  get(key, fallback) { try { const v = localStorage.getItem(key); return v == null ? fallback : JSON.parse(v); } catch (e) { return fallback; } },
  set(key, value) { try { localStorage.setItem(key, JSON.stringify(value)); return true; } catch (e) { return false; } },
};
const DEFAULT_SETTINGS = { bpm: 90, metronome: true, volume: 0.8, level: 'normal', offsetMs: 0, vibration: true, lang: null, theme: 'system' };
const Settings = {
  data: Object.assign({}, DEFAULT_SETTINGS),
  load() {
    const s = Storage.get('rmc.settings.v1', {});
    const d = Object.assign({}, DEFAULT_SETTINGS, s && typeof s === 'object' ? s : {});
    d.bpm = clamp(Math.round((+d.bpm || 90) / 5) * 5, CONFIG.BPM_MIN, CONFIG.BPM_MAX);
    d.volume = clamp(+d.volume, 0, 1); if (!isFinite(d.volume)) d.volume = 0.8;
    d.offsetMs = clamp(Math.round(+d.offsetMs || 0), -CONFIG.OFFSET_MAX_MS, CONFIG.OFFSET_MAX_MS);
    if (!LEVELS.includes(d.level)) d.level = 'normal';
    if (!['system', 'light', 'dark'].includes(d.theme)) d.theme = 'system';
    this.data = d;
  },
  save() { Storage.set('rmc.settings.v1', this.data); },
  set(k, v) { this.data[k] = v; this.save(); },
};

/* =========================================================================
   10. I18n — 번역 사전 / t(key, params) / 언어 전환
   ========================================================================= */
const I18N = {
  ko: {
    title: '리듬 마스터 챌린지', tagline: '두근거리는 패드를 박자에 맞춰 톡!',
    start: '시작하기', howTo: '방법 보기', settings: '설정',
    pcHint: 'PC: 키패드 7 · 9 · 1 · 3 으로 플레이', altKeyHint: '키패드가 없다면 Q · W · A · S',

const LANGS = [['ko', '한국어'], ['en', 'English'], ['zh', '简体中文'], ['ja', '日本語']];
const I18n = {
  lang: 'ko', urlLang: null, _nf: null,
  detect() {
    const url = new URLSearchParams(location.search).get('lang');
    if (url && I18N[url]) { this.urlLang = url; return url; }
    if (Settings.data.lang && I18N[Settings.data.lang]) return Settings.data.lang;
    for (const l of (navigator.languages || [navigator.language || ''])) {
      const s = String(l).toLowerCase();
      if (s.startsWith('ko')) return 'ko';
      if (s.startsWith('ja')) return 'ja';
      if (s.startsWith('zh')) return 'zh';
      if (s.startsWith('en')) return 'en';
    }
    return 'en';
  },
  t(key, params) {
    let s = I18N[this.lang][key];
    if (s == null) {
      s = I18N.ko[key] != null ? I18N.ko[key] : I18N.en[key];
      console.warn('[i18n] missing key', this.lang, key);
      if (s == null) s = key;
    }
    if (params) s = s.replace(/\{(\w+)\}/g, (m, k) => (params[k] != null ? params[k] : m));
    return s;
  },
  fmt(n) {
    if (!this._nf) this._nf = new Intl.NumberFormat(this.lang === 'zh' ? 'zh-CN' : this.lang);
    return this._nf.format(Math.round(n));
  },
  set(lang, persist) {
    if (!I18N[lang]) lang = 'ko';
    this.lang = lang; this._nf = null;
    document.documentElement.lang = lang;
    if (persist) Settings.set('lang', lang);
    this.loadFont(lang);
    this.apply();
  },
  loadFont(lang) {
    // 한국어·영어는 Pretendard, 일본어는 Pretendard JP, 중국어는 Noto Sans SC 를 필요할 때만 로드
    const id = 'font-' + lang;
    if (document.getElementById(id)) return;
    let href = null;
    if (lang === 'ja') href = 'static/fonts/pretendard-jp/pretendardvariable-jp-dynamic-subset.css';
    if (lang === 'zh') href = 'https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@500;700;900&display=swap';
    if (!href) return;
    const l = document.createElement('link'); l.id = id; l.rel = 'stylesheet'; l.href = href;
    document.head.appendChild(l);
  },
  apply(root = document) {
    $$('[data-i18n]', root).forEach(el => { el.textContent = this.t(el.dataset.i18n); });
    $$('[data-i18n-aria]', root).forEach(el => { el.setAttribute('aria-label', this.t(el.dataset.i18nAria)); });
    document.title = this.t('title');
    $$('.lang-select').forEach(sel => { sel.value = this.lang; });
    $$('.pad').forEach(p => p.setAttribute('aria-label', this.t('padLabel', { n: p.dataset.pad })));
    App.onLanguageChanged && App.onLanguageChanged();
  },
};
const t = (k, p) => I18n.t(k, p);
