# scs-run.sh 프로젝트 설정 (git pull 이후 source 됨)
# 사용 가능 변수: APP_NAME, APP_DIR, VENV, PYTHON, LOG_DIR, SCS_DATA_DIR

PORT="${PORT:-15002}"
HOST="${HOST:-0.0.0.0}"
WORKERS="${WORKERS:-2}"

# SQLite DB 는 데이터 디렉토리(/scsdat/app/<앱이름>)에 보관
export RMC_DATABASE="${RMC_DATABASE:-$SCS_DATA_DIR/rhythm_master.sqlite3}"

APP_CMD="$VENV/bin/gunicorn --chdir $APP_DIR --bind $HOST:$PORT --workers $WORKERS --threads 4 --timeout 30 --access-logfile - --error-logfile - app:app"
HEALTH_URL="http://127.0.0.1:$PORT/api/health"

# 링크 미리보기(OG) 이미지·URL 에 쓸 사이트 주소. 비우면 요청 주소를 사용 (nginx 가 Host·X-Forwarded-Proto 를 넘겨야 함)
# export RMC_PUBLIC_URL="https://rhythm.example.com"
