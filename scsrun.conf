# scs-run.sh 프로젝트 설정 (git pull 이후 source 됨)
# 사용 가능 변수: APP_NAME, APP_DIR, VENV, PYTHON, LOG_DIR

PORT="${PORT:-15002}"
HOST="${HOST:-0.0.0.0}"
WORKERS="${WORKERS:-2}"

# SQLite 데이터는 git 작업 트리 밖(instance/ 는 .gitignore)에 보관
export RMC_DATABASE="${RMC_DATABASE:-$APP_DIR/instance/rhythm_master.sqlite3}"

APP_CMD="$VENV/bin/gunicorn --chdir $APP_DIR --bind $HOST:$PORT --workers $WORKERS --threads 4 --timeout 30 --access-logfile - --error-logfile - app:app"
HEALTH_URL="http://127.0.0.1:$PORT/api/health"
