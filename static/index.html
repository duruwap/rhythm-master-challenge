    const amp = reducedMotion() ? 0.3 : 0.9;
    this.pads.forEach((p, i) => {
      const [bx, by] = ballAt(p.n, p.vpos, f, this.R);
      const bk = bx.toFixed(2) + ',' + by.toFixed(2);
      if (p.cache.ball !== bk) { p.cache.ball = bk; p.ball.setAttribute('cx', bx.toFixed(2)); p.ball.setAttribute('cy', by.toFixed(2)); }
      const pulse = new Array(p.n).fill(0);
      for (const n of this.rpn[r][i]) {
        const e = tv - n.time;
        if (e >= 0 && e < CONFIG.PULSE_S) {
          const k = e / CONFIG.PULSE_S;
          pulse[n.vertex] = Math.max(pulse[n.vertex], Math.max(0, Math.sin(Math.PI * Math.min(1, k * 1.25)) * (1 - k * 0.3)));
        } else if (e < 0 && e > -0.12) {
          pulse[n.vertex] = Math.max(pulse[n.vertex], (1 + e / 0.12) * 0.15);   // 닿기 직전 살짝 예고
        }
      }
      for (let k = 0; k < p.n; k++) {
        const v = pulse[k];
        const key = v.toFixed(3);
        if (p.vcache[k] === key) continue;
        p.vcache[k] = key;
        p.verts[k].setAttribute('r', (p.vr * (1 + amp * v)).toFixed(2));
        p.halos[k].style.opacity = (v * 0.9).toFixed(2);
        p.halos[k].setAttribute('r', (p.vr * (1.6 + 1.6 * v)).toFixed(2));
      }
    });

    // --- 허브: 박자 세그먼트, 재생헤드, 라운드 진행
    let beatIdx = -1, headFrac = 0;
    if (pos.phase === 'round') { beatIdx = Math.floor(pos.beat) % CONFIG.BEATS_PER_BAR; headFrac = pos.barFrac; }
    else if (pos.phase === 'tail') beatIdx = 0;   // 마무리 박
    else if (pos.phase === 'prep' && pos.beatsLeft <= CONFIG.COUNT_IN_BEATS) {
      beatIdx = CONFIG.COUNT_IN_BEATS - Math.ceil(pos.beatsLeft);
      headFrac = (CONFIG.COUNT_IN_BEATS - pos.beatsLeft) / CONFIG.COUNT_IN_BEATS;
    }
    this.hubHead.setAttribute('transform', `rotate(${(clamp(headFrac, 0, 0.9999) * 360).toFixed(2)} 50 50)`);
    if (beatIdx !== this.lastBeatIdx) {
      this.lastBeatIdx = beatIdx;
      this.hubSegs.forEach((sg, i) => sg.classList.toggle('on', i === beatIdx && pos.phase !== 'end'));
    }
    const done = pos.phase === 'end' ? CONFIG.TOTAL_ROUNDS : r + (pos.phase === 'round' ? pos.beat / g.roundBeats : pos.phase === 'tail' ? 1 : 0);
    this.hubProg.setAttribute('stroke-dasharray', `${(this.progLen * done / CONFIG.TOTAL_ROUNDS).toFixed(2)} 1000`);
    // 라운드 카운트 동안 ROUND n 크게 표시
    const showTitle = pos.phase === 'prep';
    if (this.roundTitle.hidden === showTitle) {
      this.roundTitle.hidden = !showTitle;
      if (showTitle) { this.roundTitleN.textContent = r + 1; this.roundTitleOf.textContent = '/' + CONFIG.TOTAL_ROUNDS; this.retrigger(this.roundTitle, 'x'); }
    }
    if (showTitle && this.roundTitleN.textContent !== String(r + 1)) this.roundTitleN.textContent = r + 1;
    if (pos.phase === 'prep') {
      const cnt = String(Math.max(1, Math.min(CONFIG.COUNT_IN_BEATS, Math.ceil(pos.beatsLeft))));
      if (this.lastCount !== cnt) {
        this.lastCount = cnt;
        this.hubCount.hidden = false; this.hubScore.hidden = true;
        this.hubCount.textContent = cnt;
        this.hubRound.textContent = t('countIn');
        this.retrigger(this.hubCount, 'tick');
      }
    } else {
      if (this.lastCount !== null) { this.lastCount = null; this.hubCount.hidden = true; this.hubScore.hidden = false; }
      const rt = `R${r + 1}/${CONFIG.TOTAL_ROUNDS} · ${pos.bar + 1}/${CONFIG.BARS_PER_ROUND}`;
      if (this.hubRound.textContent !== rt) this.hubRound.textContent = rt;
    }

    // --- 점수 촤르륵 (250ms, easeOutCubic)
    if (this.displayScore !== this.scoreTo) {
      const k = clamp((performance.now() - this.scoreStart) / 250, 0, 1);
      const e = 1 - Math.pow(1 - k, 3);
      this.displayScore = k >= 1 ? this.scoreTo : Math.round(this.scoreFrom + (this.scoreTo - this.scoreFrom) * e);
      this.hubScore.textContent = I18n.fmt(this.displayScore);
    }
    // --- 퍼펙트 콤보 칩 (2 이상일 때만)
    const pc = pos.phase === 'prep' ? 0 : g.score.perfectCombo;
    if (pc !== this.lastCombo) {
      this.lastCombo = pc;
      this.comboChip.hidden = pc < 2;
      if (pc >= 2) { this.comboChip.textContent = `PERFECT COMBO ×${pc}`; this.retrigger(this.comboChip, 'bump'); }
    }
  },
};

/* =========================================================================
   5. InputManager — 포인터(멀티터치) / 키보드(Q·W·A·S) → 패드 번호
   ========================================================================= */
const InputManager = {
  pointerPad: new Map(),
  lastHit: {},
  handler: null,
  normTs(ts) {
    const now = performance.now();
    return (typeof ts === 'number' && ts > 0 && ts <= now + 5 && now - ts < 500) ? ts : now;
  },
  /** 키 코드 → 현재 난이도 레이아웃의 패드 번호 (없으면 null) */
  /** 키 코드 → 현재 화면 배치의 패드 번호 (없으면 null) */
  keyToPad(code) {
    const pos = KEY_POS[code];
    if (!pos || !Renderer.pads.length) return null;
    const i = Renderer.pads.findIndex(p => (p.keys || p.def.keys).includes(pos));
    return i >= 0 ? i : null;
  },
  init(handler) {
    this.handler = handler;
    const wrap = $('#pads');
    wrap.addEventListener('pointerdown', e => {
      const el = e.target.closest('.pad'); if (!el) return;
      e.preventDefault();
      const id = +el.dataset.pad;
      try { el.setPointerCapture(e.pointerId); } catch (_) { /* noop */ }
      this.pointerPad.set(e.pointerId, id);
      this.press(id, e.timeStamp, e.pointerType !== 'mouse');
    });
    const up = e => {
      const id = this.pointerPad.get(e.pointerId); if (id == null) return;
      this.pointerPad.delete(e.pointerId);
      Renderer.setPressed(id, false);
    };
    ['pointerup', 'pointercancel', 'lostpointercapture'].forEach(ev => wrap.addEventListener(ev, up));
    wrap.addEventListener('contextmenu', e => e.preventDefault());
  },
  press(id, ts, touch) {
    const perf = this.normTs(ts);
    Renderer.setPressed(id, true);
    if (this.lastHit[id] != null && perf - this.lastHit[id] < CONFIG.CHATTER_MS) return;  // 채터링 방지
    this.lastHit[id] = perf;
    this.handler(id, perf, touch);
  },
};

/* =========================================================================
   8. ResultCard — 저장용 결과 이미지 (1080×1350, 캔버스 직접 렌더)
   ========================================================================= */
/* 총 등급: 같은 난이도 플레이어 중 상위 % 로 결정
   챌린저 1% · 마스터 3% · 다이아 7% · 플래티넘 14% · 골드 20% · 실버 25% · 브론즈 30% (누적 상한) */
const TIER_BANDS = [[1, 'CHALLENGER'], [4, 'MASTER'], [11, 'DIAMOND'], [25, 'PLATINUM'], [45, 'GOLD'], [70, 'SILVER'], [100, 'BRONZE']];
/* 기록이 충분히 쌓이기 전(MIN_RANK_SAMPLES 미만)에만 쓰는 임시 기준: 이론상 최대 점수 대비 비율 */
const TIER_FALLBACK = [[0.95, 'CHALLENGER'], [0.90, 'MASTER'], [0.82, 'DIAMOND'], [0.70, 'PLATINUM'], [0.55, 'GOLD'], [0.35, 'SILVER'], [0, 'BRONZE']];
const TIER_COLORS = {
  light: { BRONZE: '#B8692E', SILVER: '#7F8C9B', GOLD: '#E0A200', PLATINUM: '#1FA89B', DIAMOND: '#3D7DFF', MASTER: '#8A4DFF' },
  dark: { BRONZE: '#E0955A', SILVER: '#C9D2DD', GOLD: '#FFCB2E', PLATINUM: '#4FE0CF', DIAMOND: '#7AA8FF', MASTER: '#B794FF' },
};
function tierOf(res) {
  if (res.tierPct != null) return TIER_BANDS.find(([max]) => res.tierPct <= max)[1];
  const ratio = res.maxPossible ? res.total / res.maxPossible : 0;
  return TIER_FALLBACK.find(([min]) => ratio >= min)[1];
}
/** 상위 % 표시: 항상 0.1% 단위 (올림 → 실제보다 좋게 보이지 않음). 예: 10.5 */
function fmtPct(p) {
  return clamp(Math.ceil(p * 10 - 1e-9) / 10, 0.1, 100).toFixed(1);
}

/* =========================================================================
   Stats — 사이트 진입 시 서버가 페이지에 넣어 준 통계 (추가 요청·대기 없음)
   ========================================================================= */
const Stats = {
  data: null,
  init() {
    try { if (window.__RMC_STATS__ && typeof window.__RMC_STATS__ === 'object') this.data = window.__RMC_STATS__; } catch (e) { /* noop */ }
    if (!this.data && Api.enabled) {   // 페이지에 없을 때만(예: 캐시된 HTML) 비동기로 받아 둔다
      fetch('api/stats').then(r => (r.ok ? r.json() : null)).then(d => { if (d) { this.data = d; App.refreshTitle(); } }).catch(() => {});
    }
  },
  /** 등급을 상위 % 로 매길 만큼 기록이 쌓였는지 */
  enoughForTier(level) {
    const L = this.data && this.data.levels && this.data.levels[level];
    return !!L && L.plays >= CONFIG.MIN_RANK_SAMPLES;
  },
  /** 방금 보낸 기록을 화면의 누적 수에 바로 더한다 (서버도 즉시 반영, 새로고침 없이 메인 화면에 표시) */
  addLocalPlay() {
    if (!this.data) this.data = { players: 0, plays: 0, levels: {} };
    this.data.plays = (this.data.plays || 0) + 1;
    if (!Storage.get('rmc.counted.v1', false)) { this.data.players = (this.data.players || 0) + 1; Storage.set('rmc.counted.v1', true); }
  },
  /** 같은 난이도 기록 분포에서 이 점수의 상위 %. 기록이 없으면 null */
  topPercent(level, score) {
    const L = this.data && this.data.levels && this.data.levels[level];
    if (!L || !(L.plays >= CONFIG.MIN_PCT_PLAYS) || !Array.isArray(L.s) || !L.s.length) return null;
    // 점수 내림차순 표본(순위 위치 k, 점수 s)에서 "내 점수보다 높은 기록 수"를 이분 탐색
    let lo = 0, hi = L.s.length - 1, higher = 0;
    while (lo <= hi) {
      const mid = (lo + hi) >> 1;
      if (L.s[mid] > score) { higher = L.k[mid]; lo = mid + 1; } else hi = mid - 1;
    }
    return clamp((higher + 1) / (L.plays + 1) * 100, 0.1, 100);
  },
};
/* 익명 플레이어 ID (브라우저별) — "몇 명이 즐기고 있는지" 집계용 */
const Player = {
  id() {
    let v = Storage.get('rmc.pid', null);
    if (typeof v !== 'string' || !/^[A-Za-z0-9_-]{8,64}$/.test(v)) {
      const u = new Uint8Array(12);
      try { crypto.getRandomValues(u); } catch (e) { for (let i = 0; i < u.length; i++) u[i] = Math.floor(Math.random() * 256); }
      v = 'p' + Array.from(u, b => b.toString(16).padStart(2, '0')).join('');
      Storage.set('rmc.pid', v);
    }
    return v;
  },
};
const ResultCard = {
  fontFamily() {
    if (I18n.lang === 'ja') return '"Pretendard JP Variable", "Pretendard Variable", system-ui, sans-serif';
    if (I18n.lang === 'zh') return '"Noto Sans SC", "PingFang SC", "Microsoft YaHei", "Pretendard Variable", sans-serif';
    return '"Pretendard Variable", Pretendard, system-ui, sans-serif';
  },
  async waitFonts(texts) {
    if (!document.fonts || !document.fonts.load) return;
    const sample = texts.join(' ');
    const fams = ['"Pretendard Variable"'];
    if (I18n.lang === 'ja') fams.push('"Pretendard JP Variable"');
    if (I18n.lang === 'zh') fams.push('"Noto Sans SC"');
    const jobs = [];
    fams.forEach(f => [700, 900].forEach(w => jobs.push(document.fonts.load(`${w} 40px ${f}`, sample).catch(() => null))));
    await Promise.race([Promise.all(jobs).then(() => document.fonts.ready), new Promise(r => setTimeout(r, 2500))]);
  },
  rr(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
  },
  fit(ctx, text, weight, size, maxW, fam) {
    let s = size;
    do { ctx.font = `${weight} ${s}px ${fam}`; if (ctx.measureText(text).width <= maxW) break; s -= 2; } while (s > 12);
    return s;
  },
  async render(res) {
    const W = 1080, H = 1350;
    const cv = document.createElement('canvas'); cv.width = W; cv.height = H;
    const ctx = cv.getContext('2d');
    const dark = Theme.resolved() === 'dark';
    const C = n => Theme.color(n);
    const fam = this.fontFamily();
    const numFam = '"Pretendard Variable", Pretendard, system-ui, sans-serif';
    const tier = tierOf(res);
    const tierName = t('tier' + tier);
    const site = /^https?:$/.test(location.protocol) ? location.host : 'rhythm-master';
    const meta = `${t(res.level)} · BPM ${res.bpm}`;
    const date = new Intl.DateTimeFormat(I18n.lang === 'zh' ? 'zh-CN' : I18n.lang, { dateStyle: 'medium' }).format(new Date(res.playedAt));
    const code = t('challengeCode', { seed: res.seed });
    await this.waitFonts([t('title'), tierName, meta, date, code, site, ResultView.rankText(res).replace(/<[^>]+>/g, ''), '0123456789,#·RPGoX%']);

    // 배경: 네 모서리에서 번지는 파스텔 4색 + 도트 패턴
    const cols = ['--pad-7', '--pad-9', '--pad-1', '--pad-3'].map(C);
    ctx.fillStyle = C('--bg'); ctx.fillRect(0, 0, W, H);
    [[0, 0], [W, 0], [0, H], [W, H]].forEach(([x, y], k) => {
      const g = ctx.createRadialGradient(x, y, 0, x, y, 900);
      g.addColorStop(0, hexA(cols[k], dark ? 0.5 : 0.9)); g.addColorStop(1, hexA(cols[k], 0));
      ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    });
    ctx.fillStyle = dark ? 'rgba(255,255,255,.05)' : 'rgba(43,43,58,.06)';
    for (let y = 22; y < H; y += 44) for (let x = 22; x < W; x += 44) { ctx.beginPath(); ctx.arc(x, y, 3, 0, Math.PI * 2); ctx.fill(); }

    // 카드
    const cx0 = 90, cy0 = 110, cw = W - 180, ch = 1130;
    ctx.save();
    ctx.shadowColor = dark ? 'rgba(0,0,0,.5)' : 'rgba(60,40,80,.18)'; ctx.shadowBlur = 70; ctx.shadowOffsetY = 24;
    this.rr(ctx, cx0, cy0, cw, ch, 64);
    ctx.fillStyle = dark ? 'rgba(34,30,54,.93)' : 'rgba(255,255,255,.92)'; ctx.fill();
    ctx.restore();

    // 헤더: 로고 + 제목 + 날짜
    [[0, 0], [1, 0], [0, 1], [1, 1]].forEach(([i, j], k) => { this.rr(ctx, cx0 + 64 + i * 40, cy0 + 70 + j * 40, 34, 34, 9); ctx.fillStyle = cols[k]; ctx.fill(); });
    ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
    ctx.fillStyle = text; this.fit(ctx, t('title'), 800, 52, cw - 260, fam); ctx.fillText(t('title'), cx0 + 170, cy0 + 116);
    ctx.fillStyle = sub; ctx.font = `700 28px ${fam}`; ctx.fillText(date, cx0 + 172, cy0 + 156);

    ctx.textAlign = 'center';
    ctx.fillStyle = sub; ctx.font = `800 30px ${fam}`; ctx.fillText(meta, W / 2, cy0 + 268);
    // 총 등급
    const ts = this.fit(ctx, tierName, 900, 140, cw - 120, fam);
    if (tier === 'CHALLENGER') {
      const tw = ctx.measureText(tierName).width;
      const gr = ctx.createLinearGradient(W / 2 - tw / 2, 0, W / 2 + tw / 2, 0);
      gr.addColorStop(0, '#FF4D6D'); gr.addColorStop(0.5, '#9B5CFF'); gr.addColorStop(1, '#2FB4FF');

    const bs = (cw - 110) / 8, by = cy0 + 858;
    res.roundGrades.forEach((gname, i) => {
      const x = cx0 + 55 + bs * (i + 0.5);
      ctx.beginPath(); ctx.arc(x, by, bs * 0.38, 0, Math.PI * 2); ctx.fillStyle = gradeCol[gname]; ctx.fill();
      ctx.fillStyle = gname === 'PERFECT' || gname === 'GREAT' ? '#1A1628' : '#fff';
      ctx.font = `900 ${Math.round(bs * 0.3)}px ${numFam}`; ctx.fillText(short[gname], x, by + bs * 0.105);
      ctx.fillStyle = sub; ctx.font = `800 22px ${numFam}`; ctx.fillText('R' + (i + 1), x, by + bs * 0.38 + 34);
    });
    // 하단: 사이트 · 도전 코드

    ctx.fillStyle = text; this.fit(ctx, code, 800, 30, cw - 120, fam); ctx.fillText(code, W / 2, cy0 + ch - 46);

  },
};

/* =========================================================================
   결과 화면 연출 — 라운드 등급이 탁탁 찍히고, 점수가 촤르륵 오른 뒤, 총 등급 공개
   ========================================================================= */
const ResultView = {
  skipped: false, animating: false, waiters: new Set(),
  wait(ms) {
    if (this.skipped) return Promise.resolve();
    return new Promise(res => {

      const id = setTimeout(done, ms);
      this.waiters.add(done);
    });
  },
  skip() {
    if (!this.animating || this.skipped) return;
    this.skipped = true;
    Array.from(this.waiters).forEach(f => f());
  },
  countUp(el, to, dur, ease) {
    if (this.skipped || dur <= 0 || to === 0) { el.textContent = I18n.fmt(to); return Promise.resolve(); }
    return new Promise(res => {
      const t0 = performance.now(); let lastTick = 0;
      const step = () => {
        const k = clamp((performance.now() - t0) / dur, 0, 1);
        if (this.skipped || k >= 1) { el.textContent = I18n.fmt(to); res(); return; }
        el.textContent = I18n.fmt(Math.round(to * ease(k)));
        const now = performance.now();
        if (now - lastTick >= 40) { lastTick = now; AudioEngine.countTick(k); }
        requestAnimationFrame(step);
      };
      requestAnimationFrame(step);
    });
  },
  setMeta(res) {
    $('#result-meta').textContent = `${t(res.level)} · BPM ${res.bpm} · #${res.seed}`;
    $('#result-date').textContent = new Intl.DateTimeFormat(I18n.lang === 'zh' ? 'zh-CN' : I18n.lang, { dateStyle: 'medium' }).format(new Date(res.playedAt));
    const tier = tierOf(res);
    const el = $('#tier');
    el.className = 'tier tier-' + tier + (el.classList.contains('in') ? ' in' : '');
    el.textContent = t('tier' + tier);
  },
  /** 상위 % 표시 (같은 난이도 전체 기록 기준) */
  rankText(res) {
    if (res.topPct == null) return '';
    return t('rankLevel', { pct: fmtPct(res.topPct), level: t(res.level) });
  },
  showRank(res) {
    const el = $('#rank-line');
    const html = this.rankText(res);
    el.innerHTML = html; el.hidden = !html || this.animating;
  },
  async play(res, isNewRecord) {
    this.skipped = reducedMotion(); this.animating = true;
    const easeOutExpo = k => (k >= 1 ? 1 : 1 - Math.pow(2, -10 * k));
    $('#tier').classList.remove('in');
    this.setMeta(res);
    $('#total-num').textContent = '0';
    $('#new-record').hidden = true;
    $('#rank-line').hidden = true;
    $('#skip-hint').hidden = false;
    $('#result-buttons').classList.add('wait');
    const short = { PERFECT: 'P', GREAT: 'G', GOOD: 'Go', BREAK: 'X' };
    const box = $('#round-badges');
    box.innerHTML = res.roundGrades.map((g, i) => `<span class="rb ${g}" title="R${i + 1} ${g}"><i>${short[g]}</i><small>R${i + 1}</small></span>`).join('');
    await this.wait(250);
    for (const b of $$('.rb', box)) { b.classList.add('stamp'); if (!this.skipped) AudioEngine.tap(); await this.wait(110); }
    // 점수: 1.8초 easeOutExpo — 빠르게 돌다가 끝에서 조용히 멈춤
    await this.countUp($('#total-num'), res.total, 1800, easeOutExpo);
    await this.wait(200);
    $$('.rb', box).forEach(b => b.classList.add('stamp'));
    $('#tier').classList.add('in');
    if (isNewRecord) $('#new-record').hidden = false;
    $('#skip-hint').hidden = true;
    $('#result-buttons').classList.remove('wait');
    this.animating = false;
    this.showRank(res);
  },
};

/* =========================================================================
   타이밍 보정 — 메트로놈 8박에 맞춰 탭 → 평균(중앙값) 오차를 userOffset 으로
   ========================================================================= */
const Calibration = {
  active: false,
  LEAD: 4, TAPS: 8, BPM: 90,
  async start() {
    const ok = await AudioEngine.ensure();
    if (!ok) { UI.toast(t('noAudio')); return; }
    $('#settings-main').hidden = true; $('#calib-panel').hidden = false;
    const dots = $('#calib-dots'); dots.innerHTML = '';
    for (let i = 0; i < this.LEAD + this.TAPS; i++) { const d = document.createElement('i'); if (i < this.LEAD) d.className = 'lead'; dots.appendChild(d); }
    this.dots = $$('i', dots);
    this.beat = 60 / this.BPM;
    this.origin = AudioEngine.ctx.currentTime + 0.4;
    for (let i = 0; i < this.LEAD + this.TAPS; i++) AudioEngine.tick(this.origin + i * this.beat, i % 4 === 0, true);
    this.deltas = []; this.used = new Set();
    this.active = true;
    $('#calib-status').textContent = t('calibListen');
    const loop = () => {
      if (!this.active) return;
      const now = AudioEngine.audible();
      const k = Math.floor((now - this.origin) / this.beat);
      this.dots.forEach((d, i) => d.classList.toggle('beat', i === k));
      if (k >= this.LEAD && k < this.LEAD + this.TAPS) $('#calib-status').textContent = t('calibTap', { n: Math.min(this.TAPS, this.deltas.length + 1) });
      if (now > this.origin + (this.LEAD + this.TAPS) * this.beat + 0.4) { this.finish(); return; }
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  },
  tap(ts) {
    if (!this.active) return;
    AudioEngine.drum(1);
    const tt = AudioEngine.audible(InputManager.normTs(ts));
    const k = Math.round((tt - this.origin) / this.beat);
    if (k < this.LEAD || k >= this.LEAD + this.TAPS || this.used.has(k)) return;
    const d = tt - (this.origin + k * this.beat);
    if (Math.abs(d) > this.beat * 0.45) return;
    this.used.add(k); this.deltas.push(d);
    this.dots[k].classList.add('hit');
  },
  finish() {
    this.active = false;
    if (this.deltas.length < 4) { $('#calib-status').textContent = t('calibFail'); return; }
    const s = this.deltas.slice().sort((a, b) => a - b);
    const med = s.length % 2 ? s[(s.length - 1) / 2] : (s[s.length / 2 - 1] + s[s.length / 2]) / 2;
    const ms = clamp(Math.round(med * 1000 / 5) * 5, -CONFIG.OFFSET_MAX_MS, CONFIG.OFFSET_MAX_MS);
    Settings.set('offsetMs', ms);
    UI.syncSettings();
    $('#calib-status').textContent = t('calibDone', { ms: (ms > 0 ? '+' : '') + ms });
    setTimeout(() => { if (!this.active) this.close(); }, 1400);
  },
  close() {
    this.active = false;
    $('#settings-main').hidden = false; $('#calib-panel').hidden = true;
  },
};

/* =========================================================================
   UI 도우미 — 모달, 토스트, 설정 폼
   ========================================================================= */
const UI = {
  openModal(id) {
    const m = $('#' + id); m.hidden = false;
    this.lastFocus = document.activeElement;
    const f = $('[data-close]', m); if (f) f.focus({ preventScroll: true });
  },
  closeModal(m) {
    if (typeof m === 'string') m = $('#' + m);
    if (!m || m.hidden) return;
    if (m.id === 'modal-settings') Calibration.close();
    m.hidden = true;
    if (this.lastFocus && this.lastFocus.focus) this.lastFocus.focus({ preventScroll: true });
  },
  openModalEl() { return $$('.modal').find(m => !m.hidden); },
  toast(msg) {
    const el = $('#toast'); el.textContent = msg; el.classList.add('show');
    clearTimeout(this._tt); this._tt = setTimeout(() => el.classList.remove('show'), 2200);
  },
  syncSettings() {
    const d = Settings.data;
    $('#set-volume').value = Math.round(d.volume * 100); $('#out-volume').textContent = Math.round(d.volume * 100) + '%';
    $('#set-offset').value = d.offsetMs; $('#out-offset').textContent = (d.offsetMs > 0 ? '+' : '') + d.offsetMs + 'ms';
    $('#set-metronome').checked = d.metronome;
    $('#set-vibration').checked = d.vibration;
    Theme.apply();
  },
  initSettings() {
    $('#set-volume').addEventListener('input', e => { const v = +e.target.value / 100; Settings.set('volume', v); AudioEngine.setVolume(v); $('#out-volume').textContent = e.target.value + '%'; });
    $('#set-volume').addEventListener('change', () => AudioEngine.drum(1));
    $('#set-offset').addEventListener('input', e => { Settings.set('offsetMs', +e.target.value); UI.syncSettings(); });
    $('#set-metronome').addEventListener('change', e => Settings.set('metronome', e.target.checked));
    $('#set-vibration').addEventListener('change', e => Settings.set('vibration', e.target.checked));
    $('#set-theme').addEventListener('click', e => { const b = e.target.closest('button'); if (b) Theme.set(b.dataset.v); });
    $('#btn-calib').addEventListener('click', () => Calibration.start());
    $('#btn-calib-cancel').addEventListener('click', () => Calibration.close());
    $('#calib-pad').addEventListener('pointerdown', e => { e.preventDefault(); Calibration.tap(e.timeStamp); });
    if (!('vibrate' in navigator)) $('#vibration-item').hidden = true;
  },
};

/* =========================================================================
   API — 서버 기록(선택). 파일로 직접 열었거나 서버가 없으면 조용히 생략
   ========================================================================= */
const Api = {
  enabled: /^https?:$/.test(location.protocol),
  /** 결과 기록: 백그라운드 전송(keepalive), 화면은 기다리지 않는다 */
  submit(res) {
    if (!this.enabled) return false;
    const body = JSON.stringify({
      seed: res.seed, bpm: CONFIG.DEFAULT_BPM, level: res.level, score: res.total, maxPossible: res.maxPossible,
      accuracy: Math.round(res.accuracy * 100) / 100, maxCombo: res.maxPerfectCombo, playerId: Player.id(), tier: res.tier,
    });
    try {
      fetch('api/plays', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body, keepalive: true }).catch(() => {});
      return true;
    } catch (e) { return false; }
  },
};

/* =========================================================================
   12. App — 화면 전환 상태머신 (title → countIn → playing → paused → result)
   ========================================================================= */
const App = {
  state: 'title',
  game: null,
  challenge: null,
  lastResult: null,
  shareBlob: null,
  wakeLock: null,

  init() {
    Settings.load();
    Theme.init(Settings.data.theme);
    AudioEngine.volume = Settings.data.volume;
    Renderer.build();
    // 언어 선택 옵션
    $$('.lang-select').forEach(sel => {
      sel.innerHTML = LANGS.map(([v, n]) => `<option value="${v}">${n}</option>`).join('');
      sel.addEventListener('change', e => I18n.set(e.target.value, true));
    });
    I18n.set(I18n.detect(), false);
    this.readChallenge();
    Stats.init();
    UI.initSettings(); UI.syncSettings();
    InputManager.init((id, perf, touch) => this.onPad(id, perf, touch));
    this.bind();
    this.refreshTitle();
    if (!AudioEngine.supported) $('#no-audio-msg').hidden = false;
    const iOS = /iP(hone|ad|od)/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    if (iOS) $('#ios-msg').hidden = false;
    requestAnimationFrame(ts => this.loop(ts));
  },

  readChallenge() {
    const q = new URLSearchParams(location.search);
    if (!q.has('seed')) return;
    const seed = parseInt(q.get('seed'), 10);
    if (!Number.isFinite(seed) || seed < 0 || seed > 0xFFFFFFFF) return;
    const bpm = CONFIG.DEFAULT_BPM;   // BPM 고정
    const level = LEVELS.includes(q.get('lv')) ? q.get('lv') : 'normal';
    this.challenge = { seed, bpm, level };
  },
  challengeUrl(res) {
    const u = new URL(location.href);
    u.search = ''; u.hash = '';
    u.searchParams.set('seed', res.seed); u.searchParams.set('lv', res.level);
    return u.toString();
  },

  bind() {
    $$('.level-btn').forEach(b => b.addEventListener('click', () => {
      Settings.set('level', b.dataset.level);
      this.start({ seed: randomSeed(), bpm: Settings.data.bpm, level: b.dataset.level });
    }));
    $('#btn-challenge-start').addEventListener('click', () => this.start(Object.assign({}, this.challenge)));
    $('#btn-howto').addEventListener('click', () => { AudioEngine.tap(); UI.openModal('modal-howto'); });
    $('#btn-settings').addEventListener('click', () => { AudioEngine.tap(); UI.syncSettings(); UI.openModal('modal-settings'); });
    $('#btn-clear-challenge').addEventListener('click', () => {
      this.challenge = null;
      try { history.replaceState(null, '', location.pathname); } catch (e) { /* noop */ }
      this.refreshTitle();
    });
    $$('.theme-toggle').forEach(b => b.addEventListener('click', () => Theme.toggle()));
    $$('.modal').forEach(m => {
      m.addEventListener('click', e => { if (e.target === m || e.target.closest('[data-close]')) UI.closeModal(m); });
    });
    $('#hub').addEventListener('pointerdown', e => { e.preventDefault(); this.pause(); });
    $('#btn-resume').addEventListener('click', () => this.resume());
    $('#btn-pause-retry').addEventListener('click', () => this.retry());
    $('#btn-pause-home').addEventListener('click', () => this.home());
    $('#btn-retry').addEventListener('click', () => this.retry());
    $('#btn-home').addEventListener('click', () => this.home());
    $('#btn-share').addEventListener('click', () => this.share());
    $('#screen-result').addEventListener('pointerdown', () => ResultView.skip());

    document.addEventListener('keydown', e => this.onKey(e));
    document.addEventListener('keyup', e => {
      const id = this.game ? InputManager.keyToPad(e.code) : null;
      if (id != null) Renderer.setPressed(id, false);
    });
    document.addEventListener('visibilitychange', () => { if (document.hidden) this.pause(); });
    window.addEventListener('pagehide', () => this.pause());
    // 첫 상호작용 때 오디오 컨텍스트 준비 (iOS 잠금 해제)
    const prime = () => { AudioEngine.ensure(); window.removeEventListener('pointerdown', prime, true); window.removeEventListener('keydown', prime, true); };
    window.addEventListener('pointerdown', prime, true);
    window.addEventListener('keydown', prime, true);
  },

  onKey(e) {
    if (Calibration.active) {
      if (KEY_POS[e.code] || e.code === 'Space') { e.preventDefault(); if (!e.repeat) Calibration.tap(e.timeStamp); }
      else if (e.code === 'Escape') Calibration.close();
      return;
    }
    const modal = UI.openModalEl();
    if (modal) { if (e.code === 'Escape') UI.closeModal(modal); return; }
    const inGame = this.state === 'countIn' || this.state === 'playing';
    if (KEY_POS[e.code]) {
      const pad = this.game ? InputManager.keyToPad(e.code) : null;
      if (inGame && pad != null) { e.preventDefault(); if (!e.repeat) InputManager.press(pad, e.timeStamp, false); }
      return;
    }
    const onControl = e.target && e.target.closest && e.target.closest('button, select, input, a');
    if (e.code === 'Space') {
      if (inGame) { e.preventDefault(); this.pause(); }
      else if (this.state === 'paused') { e.preventDefault(); this.resume(); }
    } else if (e.code === 'Escape') {
      if (inGame) this.pause(); else if (this.state === 'paused') this.resume();
    } else if (e.code === 'Enter' || e.code === 'NumpadEnter') {
      if (onControl && e.code === 'Enter') return;   // 포커스된 버튼은 기본 동작
      if (this.state === 'title') { e.preventDefault(); this.start({ seed: randomSeed(), bpm: Settings.data.bpm, level: Settings.data.level }); }
      else if (this.state === 'result') { e.preventDefault(); if (ResultView.animating) ResultView.skip(); else this.retry(); }
      else if (this.state === 'paused') { e.preventDefault(); this.resume(); }
    }
  },

  onPad(id, perf, touch) {
    let res = null;
    if (this.game && (this.state === 'countIn' || this.state === 'playing')) res = this.game.onPad(id, perf);
    const color = this.game ? this.game.layout[id].color : id;
    AudioEngine.drum(color, res === 'perfect');
    if (touch && Settings.data.vibration && navigator.vibrate) { try { navigator.vibrate(10); } catch (e) { /* noop */ } }
  },

  showScreen(name) {
    $$('.screen').forEach(s => s.classList.toggle('active', s.id === 'screen-' + name));
    document.body.classList.toggle('playing', name === 'game');
    if (name === 'result') $('#screen-result').scrollTop = 0;
  },

  refreshTitle() {
    const best = Storage.get('rmc.best.v2.' + Settings.data.level, 0);
    $('#title-best').hidden = !(best > 0);
    const bestPct = best > 0 ? Stats.topPercent(Settings.data.level, best) : null;
    $('#title-best-n').textContent = `${I18n.fmt(best || 0)} · ${t(Settings.data.level)}`;
    $('#title-best-pct').hidden = bestPct == null;
    if (bestPct != null) $('#title-best-pct').textContent = t('topPctShort', { pct: fmtPct(bestPct) });
    const c = this.challenge;
    $('#challenge-card').hidden = !c;
    if (c) $('#challenge-info').textContent = t('challengeInfo', { seed: c.seed, bpm: c.bpm, level: t(c.level) });
    $$('.level-btn').forEach(b => b.classList.toggle('last', b.dataset.level === Settings.data.level));
    const players = (Stats.data && Stats.data.players) || 0, plays = (Stats.data && Stats.data.plays) || 0;
    $('#players-line').hidden = !(plays > 0);
    if (plays > 0) $('#players-line').textContent = t('playersNow', { n: I18n.fmt(players), plays: I18n.fmt(plays) });
  },
  onLanguageChanged() {
    if (this.state === 'title') this.refreshTitle();
    if (this.state === 'result' && this.lastResult) { ResultView.setMeta(this.lastResult); ResultView.showRank(this.lastResult); this.shareBlob = null; }
    if (Renderer.game) Renderer.hubScore.textContent = I18n.fmt(Renderer.displayScore || 0);
  },

  async start(params) {
    if (this._starting || !params) return;
    this._starting = true;
    try {
      await AudioEngine.ensure();       // 사용자 탭 시점에 생성/resume (iOS)
      AudioEngine.setVolume(Settings.data.volume);
      const p = params;
      if (this.game) this.game.stop();
      this.game = new Game(p);
      Renderer.reset(this.game);
      $('#pause-overlay').hidden = true;
      this.showScreen('game');
      this.game.begin(0);
      this.state = 'countIn';
      this.requestWakeLock();
    } finally { this._starting = false; }
  },
  retry() {
    // 친구 도전 리듬이면 같은 리듬, 아니면 같은 난이도의 새 리듬
    const last = this.game || this.lastResult;
    const c = this.challenge;
    if (c && last && last.seed === c.seed && last.level === c.level) this.start(Object.assign({}, c));
    else this.start({ seed: randomSeed(), bpm: Settings.data.bpm, level: (last && last.level) || Settings.data.level });
  },
  home() {
    if (this.game) this.game.stop();
    this.game = null; Renderer.game = null;
    $('#pause-overlay').hidden = true;
    this.state = 'title';
    this.releaseWakeLock();
    this.refreshTitle();
    this.showScreen('title');
  },
  pause() {
    if (!this.game || (this.state !== 'countIn' && this.state !== 'playing')) return;
    if (!this.game.pause()) return;
    this.state = 'paused';
    $$('.pad.pressed').forEach(p => p.classList.remove('pressed'));
    $('#pause-overlay').hidden = false;
    $('#btn-resume').focus({ preventScroll: true });
  },
  async resume() {
    if (this.state !== 'paused' || !this.game) return;
    await AudioEngine.ensure();
    $('#pause-overlay').hidden = true;
    this.game.resume();
    Renderer.reset(this.game);
    this.state = 'countIn';
    this.requestWakeLock();
  },
  onAudioInterrupted() {
    if (this.state === 'countIn' || this.state === 'playing') this.pause();
  },

  loop() {
    requestAnimationFrame(ts => this.loop(ts));
    const g = this.game;
    if (!g) return;
    if (this.state === 'countIn' || this.state === 'playing' || this.state === 'ending') {
      const now = AudioEngine.audible();
      g.update(now);
      if (g.state === 'playing' && this.state === 'countIn') this.state = 'playing';
      if (g.state === 'ending') this.state = 'ending';
      Renderer.frame(now);
      if (g.state === 'ending' && performance.now() >= g.endAt) this.showResult();
    }
  },

  showResult() {
    const g = this.game;
    g.state = 'done';
    const res = g.buildResult();
    this.lastResult = res;
    const bestKey = 'rmc.best.v2.' + res.level;   // 난이도별 최고 기록
    const prevBest = Storage.get(bestKey, 0) || 0;
    const isNew = res.total > prevBest && res.total > 0;
    if (isNew) Storage.set(bestKey, res.total);
    this.state = 'result';
    this.releaseWakeLock();
    this.showScreen('result');
    // 상위 %·등급은 미리 받아 둔 분포로 즉시 계산 (네트워크 대기 없음)
    res.topPct = Stats.topPercent(res.level, res.total);
    res.tierPct = Stats.enoughForTier(res.level) ? res.topPct : null;
    res.tier = tierOf(res);
    ResultView.play(res, isNew);
    this.renderShare();
    if (Api.submit(res)) Stats.addLocalPlay();   // 비동기 전송, 응답을 기다리지 않음
  },

  /** 저장용 이미지를 미리 만들어 둔다 (화면에는 표시하지 않음) */
  async renderShare() {
    const res = this.lastResult; if (!res) return null;
    const token = (this._shareToken = (this._shareToken || 0) + 1);
    try {
      const blob = await ResultCard.render(res);
      if (token === this._shareToken && blob) this.shareBlob = blob;
      return blob;
    } catch (e) { console.warn('result image failed', e); return null; }
  },
  /** 이미지 저장: PNG 다운로드만 */
  async share() {
    const res = this.lastResult; if (!res) return;
    const blob = this.shareBlob || await this.renderShare();
    if (!blob) return;
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = `rhythm-master-${res.seed}.png`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    UI.toast(t('imageSaved'));
  },
  async requestWakeLock() {
    try { if ('wakeLock' in navigator && !this.wakeLock) { this.wakeLock = await navigator.wakeLock.request('screen'); this.wakeLock.addEventListener('release', () => { this.wakeLock = null; }); } } catch (e) { /* 지원 안 함 */ }
  },
  releaseWakeLock() { try { if (this.wakeLock) this.wakeLock.release(); } catch (e) { /* noop */ } this.wakeLock = null; },
};

App.init();
</script>
