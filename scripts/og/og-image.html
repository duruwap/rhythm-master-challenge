<!doctype html>
<!-- OG 대표 이미지 원본 (1200×630). 수정 후 `node scripts/og/render.js` 로 static/og-image.png 를 다시 만든다.
     메인 화면 상단 로고(.logo-mark)와 같은 모양: 파스텔 4칸 + 도형 글리프 + 가운데 점 -->
<html lang="ko">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../static/fonts/pretendard/pretendardvariable-dynamic-subset.css">
<style>
  :root { --pad-7: #FF9EB5; --pad-9: #8FD3FF; --pad-1: #9EF0C8; --pad-3: #FFE38A; --pad-ink: #2F2540; --text: #2B2B3A; --sub: #6E6A80; --accent: #7B5CFF; --bg: #FFF8F0; }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    position: relative; font-family: 'Pretendard Variable', Pretendard, sans-serif; color: var(--text);
    background: var(--bg);
    display: flex; align-items: center; justify-content: center; gap: 72px;
  }
  /* 은은한 파스텔 배경 (네 모서리에 패드 색) */
  .blob { position: absolute; border-radius: 50%; filter: blur(90px); opacity: .45; z-index: 0; }
  .b1 { width: 520px; height: 520px; left: -220px; top: -240px; background: var(--pad-7); }
  .b2 { width: 520px; height: 520px; right: -220px; top: -240px; background: var(--pad-9); }
  .b3 { width: 520px; height: 520px; left: -220px; bottom: -260px; background: var(--pad-1); }
  .b4 { width: 520px; height: 520px; right: -220px; bottom: -260px; background: var(--pad-3); }

  /* 메인 화면 로고와 같은 구성 */
  .logo { position: relative; z-index: 1; flex: none; width: 330px; height: 330px; display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  .logo span {
    border-radius: 30%; display: grid; place-items: center;
    box-shadow: inset 0 -12px 0 rgba(0,0,0,.08), 0 14px 36px rgba(60,40,80,.15);
  }
  .logo svg { width: 38%; height: 38%; fill: var(--pad-ink); }
  .logo::after {
    content: ''; position: absolute; left: 50%; top: 50%; width: 26%; height: 26%;
    translate: -50% -50%; border-radius: 50%; background: var(--text); box-shadow: 0 0 0 12px var(--bg);
  }

  .text { position: relative; z-index: 1; display: flex; flex-direction: column; }
  .kicker { font-size: 26px; font-weight: 800; color: var(--accent); letter-spacing: .06em; }
  h1 { font-size: 86px; line-height: 1.02; font-weight: 900; letter-spacing: -.045em; margin-top: 14px; white-space: nowrap; }
  .ko { font-size: 32px; font-weight: 750; color: var(--sub); margin-top: 22px; letter-spacing: -.02em; }
</style>
</head>
<body>
  <div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div><div class="blob b4"></div>
  <div class="logo" aria-hidden="true">
    <span style="background:var(--pad-7)"><svg viewBox="0 0 10 10"><circle cx="5" cy="5" r="4.6"/></svg></span>
    <span style="background:var(--pad-9)"><svg viewBox="0 0 10 10"><polygon points="5,0.6 9.8,9.2 0.2,9.2"/></svg></span>
    <span style="background:var(--pad-1)"><svg viewBox="0 0 10 10"><polygon points="5,0 10,5 5,10 0,5"/></svg></span>
    <span style="background:var(--pad-3)"><svg viewBox="0 0 10 10"><polygon points="5,0.3 9.8,3.8 8,9.5 2,9.5 0.2,3.8"/></svg></span>
  </div>
  <div class="text">
    <div class="kicker">POLYRHYTHM GAME</div>
    <h1>Rhythm Master<br>Challenge</h1>
    <div class="ko">리듬 마스터 챌린지</div>
  </div>
</body>
</html>
